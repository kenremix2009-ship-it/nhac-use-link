            <i data-lucide="monitor" style="width:14px;height:14px"></i>
          </button>
          <button class="uiverse-btn" onclick="App.setPreviewViewport('mobile')" id="vp-mobile-btn" style="padding:6px 10px;font-size:0.72rem">
            <i data-lucide="smartphone" style="width:14px;height:14px"></i>
          </button>
          <button class="uiverse-btn" onclick="App.launchIsolatedViewerSimulation()" title="Mở chế độ Người Nhận Toàn Màn Hình (Như khi quét QR)" style="padding:6px 12px;font-size:0.72rem">
            <i data-lucide="maximize-2" style="width:14px;height:14px"></i>
            <span>Full QR View</span>
          </button>
        </div>
      </div>

      <div class="preview-viewport-wrapper" id="studio-preview-slot">
        <!-- #recipient-stage-mount lives here during Studio mode, or expands to fullscreen in Isolated QR mode -->
        <div id="recipient-stage-mount">
          <!-- Dedicated WebGL Canvas for Recipient Stage -->
          <canvas id="stage-webgl-canvas" class="stage-canvas-layer"></canvas>

          <!-- Top Minimal Recipient HUD -->
          <div class="recipient-hud-top">
            <div class="stage-progress-steps">
              <div class="stage-dot active" id="r-dot-1"></div>
              <div class="stage-dot" id="r-dot-2"></div>
              <div class="stage-dot" id="r-dot-3"></div>
              <span class="font-mono-hud" id="r-stage-label" style="margin-left:6px;color:var(--accent-secondary)">CHẶNG 01 / MỞ KHÓA</span>
            </div>

            <div style="display:flex;gap:8px">
              <button class="uiverse-btn" onclick="AudioSynth.toggleMute()" id="r-audio-btn" style="padding:7px 12px;font-size:0.72rem">
                <i data-lucide="volume-2" style="width:14px;height:14px"></i>
                <span id="r-audio-label">Âm Thanh</span>
              </button>
              <!-- Exit button ONLY visible when creator is previewing, completely hidden in real QR view mode -->
              <button class="uiverse-btn" id="exit-simulation-btn" onclick="App.exitIsolatedViewerSimulation()" style="padding:7px 12px;font-size:0.72rem;display:none">
                <i data-lucide="minimize-2" style="width:14px;height:14px"></i>
                <span>Thoát Chế Độ Xem Thử</span>
              </button>
            </div>
          </div>

