  <!-- ==========================================================================
       CORE APPLICATION ARCHITECTURE (MODULAR ES6 ENGINE)
       ========================================================================== -->
  <script>
    /* ==========================================================================
       MODULE 1: PROCEDURAL SVG MEMORY PHOTO GENERATOR (ZERO EXTERNAL BROKEN LINKS)
       Creates rich, high-resolution artistic SVG data-URI illustrations so every
       pre-seeded card & 3D photo frame looks sharp and loads with 100% CORS safety.
       ========================================================================== */
    const ProceduralArt = {
      createSVGDataURL(title, subtitle, c1, c2, accent) {
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
          <defs>
            <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="${c1}"/>
              <stop offset="100%" stop-color="${c2}"/>
            </linearGradient>
            <radialGradient id="glow" cx="50%" cy="42%" r="48%">
              <stop offset="0%" stop-color="${accent}" stop-opacity="0.65"/>
              <stop offset="100%" stop-color="${c2}" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <rect width="600" height="600" fill="url(#bg)"/>
          <circle cx="300" cy="250" r="220" fill="url(#glow)"/>
          <g stroke="${accent}" stroke-opacity="0.38" fill="none" stroke-width="1.5">
            <circle cx="300" cy="250" r="140"/>
            <circle cx="300" cy="250" r="95" stroke-dasharray="6 6"/>
            <path d="M300 90 L350 250 L300 410 L250 250 Z"/>
            <path d="M140 250 L300 200 L460 250 L300 300 Z"/>
            <rect x="36" y="36" width="528" height="528" rx="24"/>
          </g>
          <text x="300" y="475" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="31" font-weight="bold">${title}</text>
          <text x="300" y="515" text-anchor="middle" fill="${accent}" font-family="monospace" font-size="16" letter-spacing="4">${subtitle}</text>
        </svg>`;
        return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
      }
    };

    /* ==========================================================================
       MODULE 2: WEB AUDIO API HARMONIC SYNTHESIZER (CHIMES, INTERACTION & AMBIENT)
       ========================================================================== */
    const AudioSynth = {
      ctx: null,
      muted: false,
      ambientTimer: null,

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },

      playTone(freq = 528, duration = 0.45, type = 'sine', vol = 0.08) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

        gain.gain.setValueAtTime(0.001, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(vol, this.ctx.currentTime + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + duration);
      },

      playSuccessChord() {
        const notes = [523.25, 659.25, 783.99, 1046.5];
        notes.forEach((n, idx) => {
          setTimeout(() => this.playTone(n, 0.9, 'triangle', 0.09), idx * 95);
        });
      },

      playErrorBuzz() {
        this.playTone(170, 0.25, 'sawtooth', 0.06);
        setTimeout(() => this.playTone(145, 0.3, 'sawtooth', 0.06), 110);
      },

      startAmbientLoop(style = 'harp') {
        this.stopAmbientLoop();
        const scales = {
          harp: [261.63, 329.63, 392.00, 493.88, 523.25, 659.25, 783.99],
          musicbox: [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50],
          ethereal: [220.00, 277.18, 329.63, 440.00, 554.37, 659.25]
        };
        const pool = scales[style] || scales.harp;
        let step = 0;
        this.ambientTimer = setInterval(() => {
          if (this.muted) return;
          const note = pool[step % pool.length];
          this.playTone(note, 1.8, style === 'musicbox' ? 'sine' : 'triangle', 0.035);
          step++;
        }, 1350);
      },

      stopAmbientLoop() {
        if (this.ambientTimer) {
          clearInterval(this.ambientTimer);
          this.ambientTimer = null;
        }
      },

      toggleMute() {
        this.muted = !this.muted;
        const lbl = document.getElementById('r-audio-label');
        if (lbl) lbl.textContent = this.muted ? 'Đã Tắt Tiếng' : 'Âm Thanh';
        App.toast(this.muted ? 'Đã tắt âm thanh nền' : 'Đã bật giai điệu ánh sáng');
      }
    };

