          <button class="preview-stage-btn active" data-pstage="1" onclick="RecipientExperience.goToStage(1)">1. Mini-Game</button>
          <button class="preview-stage-btn" data-pstage="2" onclick="RecipientExperience.goToStage(2)">2. Cử Chỉ</button>
          <button class="preview-stage-btn" data-pstage="3A" onclick="RecipientExperience.goToStage('3A')">3A. Hạt 3D</button>
          <button class="preview-stage-btn" data-pstage="3B" onclick="RecipientExperience.goToStage('3B')">3B. Đường Ký Ức</button>
