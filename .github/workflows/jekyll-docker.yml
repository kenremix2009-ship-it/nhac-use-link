            mainLetter: 'Gửi người con gái anh thương,\n\nNgày 20/10 năm nay, anh gói trọn những kỷ niệm đẹp nhất của chúng mình vào dải ngân hà 3D này. Cảm ơn em vì sự dịu dàng, thấu hiểu và nguồn năng lượng tích cực mà em mang đến mỗi ngày.\n\nChúc em luôn kiêu hãnh, hạnh phúc và tỏa sáng rực rỡ nhất trong thế giới của riêng mình và trong trái tim anh.'
          },
          {
            id: 'card-friend-2010',
            title: 'Chuyến Bay Thanh Xuân',
            recipientName: 'Tri Kỷ Của Tôi',
            senderName: 'Người bạn đồng hành',
            theme: 'friend',
            particleShape: 'cloud',
            miniGame: 'trivia',
            gestureType: 'longpress',
            vehicleType: 'glider',
            musicStyle: 'ethereal',
            puzzleImage: ProceduralArt.createSVGDataURL('BẦU TRỜI THANH XUÂN', 'TÌNH BẠN DIỆU KỲ', '#08203e', '#030b17', '#38bdf8'),
            scratchSecret: 'TÌNH BẠN BẤT DIỆT — 20/10',
            catcherTarget: 6,
            triviaQuestions: [
              {
                question: 'Điều gì làm nên tình bạn bền vững của chúng ta suốt những năm qua?',
                options: ['Cùng đam mê khám phá', 'Luôn thẳng thắn và sẻ chia mọi buồn vui', 'Những cuộc trò chuyện thâu đêm', 'Tất cả những điều trên'],
                correctIndex: 3,
                hint: 'Đáp án bao hàm tất cả kỷ niệm của tụi mình!'
              }
            ],
            memories: [
              {
                img: ProceduralArt.createSVGDataURL('NHỮNG CHUYẾN ĐI XA', 'KÝ ỨC THANH XUÂN 01', '#0c2d57', '#040c1a', '#38bdf8'),
                caption: 'Những chuyến đi ngẫu hứng đầy ắp tiếng cười dưới bầu trời xanh biếc.',
                date: 'Hành Trình Rực Rỡ'
              },
              {
                img: ProceduralArt.createSVGDataURL('SẺ CHIA THẤU HIỂU', 'KÝ ỨC THANH XUÂN 02', '#0f3566', '#050e1c', '#7dd3fc'),
                caption: 'Cảm ơn bạn đã luôn lắng nghe và tiếp thêm sức mạnh mỗi khi tôi chùn bước.',
                date: 'Tri Kỷ Đồng Hành'
              }
            ],
            mainLetter: 'Gửi người bạn tuyệt vời,\n\nNhân ngày 20/10, chúc bạn luôn giữ vững đôi cánh tự do, bay cao tới những chân trời mơ ước. Cảm ơn vì đã trở thành một phần thanh xuân tươi đẹp và đáng tự hào nhất!'
          }
        ];
      },

      loadCards() {
        try {
          const raw = localStorage.getItem(this.CARDS_KEY);
          if (!raw) {
            const seeds = this.getDefaultSeedCards();
            this.saveCards(seeds);
            return seeds;
          }
          return JSON.parse(raw);
        } catch (e) {
          return this.getDefaultSeedCards();
        }
      },

      saveCards(cards) {
        try {
          localStorage.setItem(this.CARDS_KEY, JSON.stringify(cards));
        } catch (e) {
          console.warn('Storage quota notice:', e);
        }
      },

      getUser() {
        try {
          const raw = localStorage.getItem(this.USER_KEY);
          return raw ? JSON.parse(raw) : null;
        } catch (e) {
          return null;
        }
      },

      setUser(user) {
        localStorage.setItem(this.USER_KEY, JSON.stringify(user));
      },

      encodeCardPayload(card) {
        try {
          // Create a compact clone for QR URL portability across devices
          const compact = {
            id: card.id,
            t: card.title,
            r: card.recipientName,
            s: card.senderName,
            th: card.theme,
            ps: card.particleShape,
            mg: card.miniGame,
            gt: card.gestureType,
            vt: card.vehicleType,
            ms: card.musicStyle,
            ss: card.scratchSecret,
            ct: card.catcherTarget,
            ml: card.mainLetter
          };
          return btoa(encodeURIComponent(JSON.stringify(compact)));
        } catch (e) {
          return '';
        }
      },

      decodeCardPayload(encoded) {
        try {
          const obj = JSON.parse(decodeURIComponent(atob(encoded)));
          const fallback = this.getDefaultSeedCards()[0];
          return {
            ...fallback,
            id: obj.id || 'qr-card',
            title: obj.t || fallback.title,
            recipientName: obj.r || fallback.recipientName,
            senderName: obj.s || fallback.senderName,
            theme: obj.th || fallback.theme,
            particleShape: obj.ps || fallback.particleShape,
            miniGame: obj.mg || fallback.miniGame,
            gestureType: obj.gt || fallback.gestureType,
            vehicleType: obj.vt || fallback.vehicleType,
            musicStyle: obj.ms || fallback.musicStyle,
            scratchSecret: obj.ss || fallback.scratchSecret,
            catcherTarget: obj.ct || 6,
            mainLetter: obj.ml || fallback.mainLetter
          };
        } catch (e) {
          return null;
        }
      }
    };

    /* ==========================================================================
       MODULE 4: LUMINA WEBGL 3D ENGINE (THREE.JS + GSAP)
       Handles:
       1. Ambient 3D background particles on Landing/Dashboard
       2. Stage 3A: 8,000-Particle Morphing Entity (Heart, Cloud, Airplane, Lotus, Rose)
       3. Stage 3B: CatmullRomCurve3 3D Memory Lane + 5 Custom 3D Vehicles + Floating Photo Portals
       ========================================================================== */
    class LuminaWebGLController {
      constructor(canvasId, isRecipientStage = false) {
        this.canvas = document.getElementById(canvasId);
        this.isRecipientStage = isRecipientStage;
        this.scene = new THREE.Scene();
        this.camera = new THREE.PerspectiveCamera(55, 1, 0.1, 250);
        this.camera.position.set(0, 1.2, 14);

        this.renderer = new THREE.WebGLRenderer({
          canvas: this.canvas,
          antialias: true,
          alpha: true,
          powerPreference: 'high-performance'
        });
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        this.particleCount = isRecipientStage ? 8000 : 3200;
        this.currentMode = '3A'; // '3A' or '3B'
        this.mouse = { x: 0, y: 0, targetX: 0, targetY: 0 };
        this.splineProgress = 0;

        this.photoPortals = [];
        this.vehicleGroup = new THREE.Group();
        this.memoryLaneGroup = new THREE.Group();
        this.fireworksGroup = new THREE.Group();

        this.initLights();
        this.initMorphingParticleCloud();
        if (this.isRecipientStage) {
          this.initMemoryLaneSpline();
          this.scene.add(this.fireworksGroup);
        }

        this.bindEvents();
        this.resize();
        this.animate();
      }

      initLights() {
        const ambient = new THREE.AmbientLight(0xffffff, 0.85);
        this.pointLight1 = new THREE.PointLight(0xf59e0b, 2.5, 45);
        this.pointLight1.position.set(6, 8, 8);
        this.pointLight2 = new THREE.PointLight(0xfde68a, 1.8, 45);
        this.pointLight2.position.set(-6, -4, 6);
        this.scene.add(ambient, this.pointLight1, this.pointLight2);
      }

      /* Generates glowing radial sprite texture for Three.js Points */
      createGlowSprite() {
        const c = document.createElement('canvas');
        c.width = 64;
        c.height = 64;
        const ctx = c.getContext('2d');
        const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
        grad.addColorStop(0, 'rgba(255,255,255,1)');
        grad.addColorStop(0.28, 'rgba(255,255,255,0.85)');
        grad.addColorStop(0.65, 'rgba(255,255,255,0.22)');
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 64, 64);
        return new THREE.CanvasTexture(c);
      }

      /* Parametric 3D Point Cloud Generators for the 5 Shapes */
      computeShapePositions(shapeType) {
        const arr = new Float32Array(this.particleCount * 3);
        const N = this.particleCount;

        for (let i = 0; i < N; i++) {
          const i3 = i * 3;
          const u = Math.random();
          const v = Math.random();
          const theta = u * Math.PI * 2;
          const phi = v * Math.PI;

          let x = 0, y = 0, z = 0;

          if (shapeType === 'heart') {
            // 3D Parametric Love Heart
            const t = theta;
            const r = Math.cbrt(Math.random()) * 0.27;
            x = r * 16 * Math.pow(Math.sin(t), 3);
            y = r * (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            z = (Math.random() - 0.5) * 2.4 * (1 - Math.abs(y) / 5.5);
          } else if (shapeType === 'cloud') {
            // Fluffy Multi-Puff Cumulus Cloud
            const puffs = [
              { cx: 0, cy: 0.5, cz: 0, rx: 2.6, ry: 1.7, rz: 1.8 },
              { cx: -2.4, cy: -0.2, cz: 0.2, rx: 1.9, ry: 1.3, rz: 1.5 },
              { cx: 2.4, cy: -0.1, cz: -0.2, rx: 2.0, ry: 1.4, rz: 1.5 },
              { cx: -1.1, cy: 1.2, cz: 0.3, rx: 1.6, ry: 1.3, rz: 1.4 },
              { cx: 1.3, cy: 1.1, cz: -0.2, rx: 1.5, ry: 1.2, rz: 1.3 }
            ];
            const p = puffs[i % puffs.length];
            const rad = Math.cbrt(Math.random());
            x = p.cx + rad * p.rx * Math.sin(phi) * Math.cos(theta);
            y = p.cy + rad * p.ry * Math.cos(phi);
            z = p.cz + rad * p.rz * Math.sin(phi) * Math.sin(theta);
          } else if (shapeType === 'airplane') {
            // 3D Geometric Swept-Wing Airplane
            const section = Math.random();
            if (section < 0.42) {
              // Fuselage
              z = (Math.random() - 0.5) * 9.0;
              const taper = 1 - Math.pow(z / 5.0, 2) * 0.65;
              const ang = Math.random() * Math.PI * 2;
              const rad = 0.55 * taper * Math.sqrt(Math.random());
              x = Math.cos(ang) * rad;
              y = Math.sin(ang) * rad;
            } else if (section < 0.84) {
              // Swept Main Wings
              const side = Math.random() < 0.5 ? -1 : 1;
              const span = Math.random() * 4.8;
              x = side * (0.4 + span);
              z = -span * 0.45 + (Math.random() - 0.5) * (1.4 - span * 0.2);
              y = (Math.random() - 0.5) * 0.16;
            } else {
              // Tail Fin & Stabilizers
              const h = Math.random() * 1.9;
              x = (Math.random() - 0.5) * 0.18;
              y = 0.3 + h;
              z = -3.6 - h * 0.35 + (Math.random() - 0.5) * 0.7;
            }
          } else if (shapeType === 'rose') {
            // 3D Blooming Spiral Rose (Rhodonea)
            const k = 4.5;
            const r = 3.8 * Math.pow(Math.random(), 0.65);
            const petalWave = Math.sin(k * theta) * 0.85;
            x = (r + petalWave) * Math.cos(theta) * 0.85;
            z = (r + petalWave) * Math.sin(theta) * 0.85;
            y = Math.cos(r * 1.2) * 1.35 + (Math.random() - 0.5) * 0.35;
          } else {
            // Default 'lotus': Maternal Sacred Lotus + Halo
            if (i < N * 0.78) {
              const petals = 8;
              const layer = (i % 3) + 1;
              const t = theta;
              const petalShape = Math.abs(Math.sin((petals / 2) * t));
              const rad = (0.9 + layer * 0.85) * (0.55 + 0.45 * petalShape);
              x = rad * Math.cos(t);
              z = rad * Math.sin(t);
              y = -1.6 + Math.pow(rad * 0.45, 1.65) + layer * 0.25;
            } else {
              // Warm Maternal Halo Ring behind Lotus
              const ringR = 3.7 + (Math.random() - 0.5) * 0.35;
              x = ringR * Math.cos(theta);
              y = 0.6 + ringR * Math.sin(theta);
              z = -1.2 + (Math.random() - 0.5) * 0.3;
            }
          }

          arr[i3] = x;
          arr[i3 + 1] = y;
          arr[i3 + 2] = z;
        }
        return arr;
      }

      initMorphingParticleCloud() {
        this.particleGeometry = new THREE.BufferGeometry();
        const initialPos = this.computeShapePositions('lotus');
        const colors = new Float32Array(this.particleCount * 3);

        const cPrimary = new THREE.Color(0xf59e0b);
        const cSecondary = new THREE.Color(0xfde68a);

        for (let i = 0; i < this.particleCount; i++) {
          const mixC = cPrimary.clone().lerp(cSecondary, Math.random());
          colors[i * 3] = mixC.r;
          colors[i * 3 + 1] = mixC.g;
          colors[i * 3 + 2] = mixC.b;
        }

        this.particleGeometry.setAttribute('position', new THREE.BufferAttribute(initialPos, 3));
        this.particleGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        this.particleMaterial = new THREE.PointsMaterial({
          size: this.isRecipientStage ? 0.14 : 0.11,
          map: this.createGlowSprite(),
          vertexColors: true,
          transparent: true,
          opacity: 0.92,
          depthWrite: false,
          blending: THREE.AdditiveBlending
        });

        this.particleSystem = new THREE.Points(this.particleGeometry, this.particleMaterial);
        this.scene.add(this.particleSystem);
      }

      morphToShape(shapeType) {
        const targetPositions = this.computeShapePositions(shapeType);
        const posAttr = this.particleGeometry.attributes.position;
        const startPositions = Float32Array.from(posAttr.array);
        const tweenObj = { t: 0 };

        gsap.killTweensOf(tweenObj);
        gsap.to(tweenObj, {
          t: 1,
          duration: 1.5,
          ease: 'power3.inOut',
          onUpdate: () => {
            const arr = posAttr.array;
            for (let i = 0; i < arr.length; i++) {
              arr[i] = startPositions[i] + (targetPositions[i] - startPositions[i]) * tweenObj.t;
            }
            posAttr.needsUpdate = true;
          }
        });
      }

      updateThemeColors(primaryHex, secondaryHex) {
        const c1 = new THREE.Color(primaryHex);
        const c2 = new THREE.Color(secondaryHex);
        if (this.pointLight1) this.pointLight1.color.copy(c1);
        if (this.pointLight2) this.pointLight2.color.copy(c2);

        const colorAttr = this.particleGeometry.attributes.color;
        const arr = colorAttr.array;
        for (let i = 0; i < this.particleCount; i++) {
          const mixed = c1.clone().lerp(c2, (i % 10) / 10);
          arr[i * 3] = mixed.r;
          arr[i * 3 + 1] = mixed.g;
          arr[i * 3 + 2] = mixed.b;
        }
        colorAttr.needsUpdate = true;
      }

      /* ======================================================================
         SCENE 3B: CATMULL-ROM SPLINE MEMORY LANE & 3D VEHICLE AVATAR
         ====================================================================== */
      initMemoryLaneSpline() {
        this.scene.add(this.memoryLaneGroup);
        this.memoryLaneGroup.visible = false;

        // Define a sweeping 3D CatmullRomCurve3 through space
        const curvePoints = [
          new THREE.Vector3(0, 0, 10),
          new THREE.Vector3(-4.5, 1.2, -5),
          new THREE.Vector3(4.5, 2.5, -22),
          new THREE.Vector3(-4.0, 0.8, -39),
          new THREE.Vector3(3.5, 2.2, -56),
          new THREE.Vector3(0, 1.5, -74)
        ];
        this.splineCurve = new THREE.CatmullRomCurve3(curvePoints);

        // Glowing Spline Tube Pathway
        const tubeGeo = new THREE.TubeGeometry(this.splineCurve, 180, 0.14, 12, false);
        const tubeMat = new THREE.MeshBasicMaterial({
          color: 0xf59e0b,
          wireframe: true,
          transparent: true,
          opacity: 0.38
        });
        this.splineTubeMesh = new THREE.Mesh(tubeGeo, tubeMat);
        this.memoryLaneGroup.add(this.splineTubeMesh);

        // Add vehicle container
        this.memoryLaneGroup.add(this.vehicleGroup);
        this.buildVehicleAvatar('boat');
      }

      /* Builds Procedural 3D Mesh for the 5 Chosen Vehicles */
      buildVehicleAvatar(vehicleType) {
        while (this.vehicleGroup.children.length > 0) {
          this.vehicleGroup.remove(this.vehicleGroup.children[0]);
        }
        this.currentVehicleType = vehicleType;

        const matPrimary = new THREE.MeshStandardMaterial({
          color: 0xfde68a,
          emissive: 0xf59e0b,
          emissiveIntensity: 0.45,
          roughness: 0.25,
          metalness: 0.6,
          side: THREE.DoubleSide
        });

        const wireMat = new THREE.MeshBasicMaterial({
          color: 0xffffff,
          wireframe: true,
          transparent: true,
          opacity: 0.45
        });

        if (vehicleType === 'leaf') {
          // Drifting Autumn Leaf
          const leafGeo = new THREE.ConeGeometry(0.65, 1.8, 4);
          leafGeo.scale(1, 1, 0.18);
          leafGeo.rotateX(Math.PI / 2);
          const mesh = new THREE.Mesh(leafGeo, matPrimary);
          this.vehicleGroup.add(mesh, new THREE.Mesh(leafGeo, wireMat));
        } else if (vehicleType === 'glider') {
          // Paper Glider Dart
          const wingGeo = new THREE.ConeGeometry(0.9, 2.2, 3);
          wingGeo.scale(1.2, 1, 0.22);
          wingGeo.rotateX(-Math.PI / 2);
          const mesh = new THREE.Mesh(wingGeo, matPrimary);
          this.vehicleGroup.add(mesh, new THREE.Mesh(wingGeo, wireMat));
        } else if (vehicleType === 'crane') {
          // Origami Crane with Animated Wings
          const bodyGeo = new THREE.OctahedronGeometry(0.45, 0);
          bodyGeo.scale(0.7, 0.6, 1.8);
          const body = new THREE.Mesh(bodyGeo, matPrimary);

          const wingGeo = new THREE.BoxGeometry(1.5, 0.04, 0.7);
          this.leftWing = new THREE.Mesh(wingGeo, matPrimary);
          this.leftWing.position.set(-0.75, 0.1, 0);
          this.rightWing = new THREE.Mesh(wingGeo, matPrimary);
          this.rightWing.position.set(0.75, 0.1, 0);

          this.vehicleGroup.add(body, this.leftWing, this.rightWing);
        } else if (vehicleType === 'train') {
          // Vintage Memory Train
          const loco = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.75, 1.8), matPrimary);
          const cabin = new THREE.Mesh(new THREE.BoxGeometry(0.88, 0.55, 0.7), matPrimary);
          cabin.position.set(0, 0.5, 0.4);
          const chimney = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.55, 12), matPrimary);
          chimney.position.set(0, 0.55, -0.55);
          this.vehicleGroup.add(loco, cabin, chimney);
        } else {
          // Paper Boat (Default)
          const hullGeo = new THREE.ConeGeometry(0.75, 1.9, 4);
          hullGeo.rotateX(Math.PI / 2);
          hullGeo.scale(0.85, 0.45, 1.1);
          const hull = new THREE.Mesh(hullGeo, matPrimary);

          const sailGeo = new THREE.ConeGeometry(0.5, 0.95, 4);
          sailGeo.position.set(0, 0.45, 0);
          const sail = new THREE.Mesh(sailGeo, matPrimary);
          this.vehicleGroup.add(hull, sail, new THREE.Mesh(hullGeo, wireMat));
        }
      }

      /* Rebuilds Floating 3D Photo Portals along the CatmullRomCurve3 */
      rebuildPhotoPortals(memories = []) {
        if (!this.isRecipientStage) return;
        // Remove previous portals
        this.photoPortals.forEach(p => this.memoryLaneGroup.remove(p.group));
        this.photoPortals = [];

        const loader = new THREE.TextureLoader();
        const total = Math.max(memories.length, 1);

        memories.forEach((mem, idx) => {
          const t = 0.16 + ((idx + 0.5) / total) * 0.72;
          const pt = this.splineCurve.getPointAt(t);
          const tangent = this.splineCurve.getTangentAt(t);
          const side = idx % 2 === 0 ? -1 : 1;

          const portalGroup = new THREE.Group();
          portalGroup.position.set(pt.x + side * 2.65, pt.y + 0.9, pt.z);

          // Glowing Outer Frame
          const frameGeo = new THREE.BoxGeometry(2.7, 2.7, 0.12);
          const frameMat = new THREE.MeshStandardMaterial({
            color: 0xf59e0b,
            emissive: 0xf59e0b,
            emissiveIntensity: 0.35,
            roughness: 0.2,
            metalness: 0.8
          });
          const frameMesh = new THREE.Mesh(frameGeo, frameMat);
          portalGroup.add(frameMesh);

          // Photo Plane
          const tex = loader.load(mem.img);
          const photoGeo = new THREE.PlaneGeometry(2.4, 2.4);
          const photoMat = new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide });
          const photoMesh = new THREE.Mesh(photoGeo, photoMat);
          photoMesh.position.z = 0.08;
          portalGroup.add(photoMesh);

          // Orient slightly toward the path
          portalGroup.lookAt(pt.x, pt.y + 0.8, pt.z + 4);

          this.memoryLaneGroup.add(portalGroup);
          this.photoPortals.push({
            group: portalGroup,
            frameMat,
            t,
            memory: mem,
            index: idx
          });
        });
      }

      setStageMode(mode) {
        this.currentMode = mode;
        if (!this.isRecipientStage) return;

        if (mode === '3A') {
          this.memoryLaneGroup.visible = false;
          this.particleSystem.visible = true;
          gsap.to(this.camera.position, { x: 0, y: 1.2, z: 13.5, duration: 1.4, ease: 'power3.out' });
          gsap.to(this.particleSystem.scale, { x: 1, y: 1, z: 1, duration: 1.2 });
        } else if (mode === '3B') {
          this.memoryLaneGroup.visible = true;
          this.particleSystem.visible = true;
          // Expand particles into surrounding starfield tunnel
          gsap.to(this.particleSystem.scale, { x: 4.5, y: 4.5, z: 12, duration: 1.8, ease: 'power2.out' });
          this.updateSplineJourney(this.splineProgress);
        }
      }

      updateSplineJourney(normalizedT) {
        if (!this.isRecipientStage || !this.splineCurve) return;
        this.splineProgress = Math.max(0, Math.min(0.995, normalizedT));

        // Position vehicle ahead on the spline
        const vehicleT = Math.min(0.998, this.splineProgress + 0.045);
        const vehiclePos = this.splineCurve.getPointAt(vehicleT);
        const vehicleTan = this.splineCurve.getTangentAt(vehicleT);
        this.vehicleGroup.position.copy(vehiclePos);
        this.vehicleGroup.lookAt(vehiclePos.clone().add(vehicleTan));

        // Position camera smoothly behind and slightly above the vehicle
        const camPos = this.splineCurve.getPointAt(this.splineProgress);
        this.camera.position.set(camPos.x, camPos.y + 1.45, camPos.z + 3.2);
        this.camera.lookAt(vehiclePos.x, vehiclePos.y + 0.35, vehiclePos.z);

        // Check proximity to Floating 3D Photo Portals
        let activePortal = null;
        let minDistance = 999;

        this.photoPortals.forEach(portal => {
          const dist = Math.abs(this.splineProgress - portal.t);
          if (dist < 0.11 && dist < minDistance) {
            minDistance = dist;
            activePortal = portal;
          }
          // Highlight close frame and tilt toward camera
          if (dist < 0.12) {
            portal.frameMat.emissiveIntensity = 0.95;
            portal.group.scale.setScalar(1.12);
          } else {
            portal.frameMat.emissiveIntensity = 0.28;
            portal.group.scale.setScalar(1.0);
          }
        });

        RecipientExperience.updateActivePortalHUD(activePortal);
      }

      spawn3DFireworkBurst() {
        const count = 220;
        const geo = new THREE.BufferGeometry();
        const pos = new Float32Array(count * 3);
        const vels = [];

        const origin = this.vehicleGroup.position.clone();
        for (let i = 0; i < count; i++) {
          pos[i * 3] = origin.x;
          pos[i * 3 + 1] = origin.y + 1.5;
          pos[i * 3 + 2] = origin.z - 2;
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.random() * Math.PI;
          const speed = 0.08 + Math.random() * 0.22;
          vels.push({
            vx: speed * Math.sin(phi) * Math.cos(theta),
            vy: speed * Math.cos(phi),
            vz: speed * Math.sin(phi) * Math.sin(theta)
          });
        }

        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        const mat = new THREE.PointsMaterial({
          size: 0.28,
          map: this.createGlowSprite(),
          color: 0xfde68a,
          transparent: true,
          opacity: 1,
          blending: THREE.AdditiveBlending
        });

        const points = new THREE.Points(geo, mat);
        this.fireworksGroup.add(points);

        const anim = { p: 0 };
        gsap.to(anim, {
          p: 1,
          duration: 1.8,
          ease: 'power2.out',
          onUpdate: () => {
            const arr = geo.attributes.position.array;
            for (let i = 0; i < count; i++) {
              arr[i * 3] += vels[i].vx;
              arr[i * 3 + 1] += vels[i].vy - anim.p * 0.03;
              arr[i * 3 + 2] += vels[i].vz;
            }
            geo.attributes.position.needsUpdate = true;
            mat.opacity = 1 - anim.p;
          },
          onComplete: () => {
            this.fireworksGroup.remove(points);
            geo.dispose();
            mat.dispose();
          }
        });
      }

      bindEvents() {
        window.addEventListener('mousemove', e => {
          this.mouse.targetX = (e.clientX / window.innerWidth - 0.5) * 2;
          this.mouse.targetY = -(e.clientY / window.innerHeight - 0.5) * 2;
        });
        window.addEventListener('resize', () => this.resize());
      }

      resize() {
        if (!this.canvas) return;
        const parent = this.canvas.parentElement || document.body;
        const w = this.isRecipientStage ? parent.clientWidth : window.innerWidth;
        const h = this.isRecipientStage ? parent.clientHeight : window.innerHeight;
        if (w === 0 || h === 0) return;
        this.camera.aspect = w / h;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(w, h, false);
      }

      animate() {
        requestAnimationFrame(() => this.animate());
        const time = performance.now() * 0.001;

        this.mouse.x += (this.mouse.targetX - this.mouse.x) * 0.06;
        this.mouse.y += (this.mouse.targetY - this.mouse.y) * 0.06;

        if (this.particleSystem) {
          if (this.currentMode === '3A') {
            this.particleSystem.rotation.y = time * 0.22 + this.mouse.x * 0.65;
            this.particleSystem.rotation.x = this.mouse.y * 0.35;
          } else {
            this.particleSystem.rotation.y = time * 0.03;
          }
        }

        // Animate vehicle bobbing and crane wings in Scene 3B
        if (this.isRecipientStage && this.currentMode === '3B') {
          this.vehicleGroup.position.y += Math.sin(time * 3.2) * 0.008;
          if (this.currentVehicleType === 'crane' && this.leftWing && this.rightWing) {
            this.leftWing.rotation.z = Math.sin(time * 6) * 0.45;
            this.rightWing.rotation.z = -Math.sin(time * 6) * 0.45;
          }
        }

        // Update HUD camera readout on main header
        if (!this.isRecipientStage) {
          const hudEl = document.getElementById('hud-coords-readout');
          if (hudEl) {
            hudEl.textContent = `CAM: ${(this.mouse.x * 2).toFixed(2)}, ${(1.2 + this.mouse.y).toFixed(2)}, 14.00`;
          }
        }

        this.renderer.render(this.scene, this.camera);
      }
    }

    /* ==========================================================================
       MODULE 5: 3-STAGE RECIPIENT EXPERIENCE CONTROLLER
       Manages Stage 1 (4 Playable Mini-Games), Stage 2 (3 Gestures with Particle Trail),
       and Stage 3 (3A Particle Entity + 3B Memory Lane Spline).
       ========================================================================== */
    const RecipientExperience = {
      activeCard: null,
      currentStage: 1,
      catcherRAF: null,
      gestureRAF: null,
      lastPortalIndex: -1,

      loadCard(card) {
        this.activeCard = JSON.parse(JSON.stringify(card));
        document.getElementById('r-recipient-inline').textContent = this.activeCard.recipientName;
        document.getElementById('r-3a-heading').textContent = `Dành Tặng ${this.activeCard.recipientName}`;

        // Sync Theme & 3D Engine
        App.applyThemePaletteOnly(this.activeCard.theme);
        if (window.stageWebGL) {
          window.stageWebGL.morphToShape(this.activeCard.particleShape);
          window.stageWebGL.buildVehicleAvatar(this.activeCard.vehicleType);
          window.stageWebGL.rebuildPhotoPortals(this.activeCard.memories || []);
        }

        this.goToStage(1);
      },

      goToStage(stageId) {
        this.currentStage = stageId;
        if (this.catcherRAF) cancelAnimationFrame(this.catcherRAF);
        if (this.gestureRAF) cancelAnimationFrame(this.gestureRAF);

        // Update studio preview pills
        document.querySelectorAll('.preview-stage-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.pstage === String(stageId));
        });

        // Update Recipient Top Dots
        const d1 = document.getElementById('r-dot-1');
        const d2 = document.getElementById('r-dot-2');
        const d3 = document.getElementById('r-dot-3');
        const lbl = document.getElementById('r-stage-label');
        d1.classList.toggle('active', stageId === 1);
        d2.classList.toggle('active', stageId === 2);
        d3.classList.toggle('active', stageId === '3A' || stageId === '3B');

        document.getElementById('substage-1').classList.toggle('active', stageId === 1);
        document.getElementById('substage-2').classList.toggle('active', stageId === 2);
        document.getElementById('substage-3-hud').classList.toggle('active', stageId === '3A' || stageId === '3B');

        if (stageId === 1) {
          lbl.textContent = 'CHẶNG 01 / MINI-GAME MỞ KHÓA';
          if (window.stageWebGL) window.stageWebGL.setStageMode('3A');
          this.renderStage1MiniGame();
        } else if (stageId === 2) {
          lbl.textContent = 'CHẶNG 02 / CỬ CHỈ KHỞI ĐỘNG';
          if (window.stageWebGL) window.stageWebGL.setStageMode('3A');
          this.initStage2GestureCanvas();
        } else if (stageId === '3A') {
          lbl.textContent = 'CHẶNG 03A / HẠT 3D BIẾN HÌNH';
          document.getElementById('scene-3a-banner').style.display = 'block';
          document.getElementById('scene-3b-controls').style.display = 'none';
          document.getElementById('memory-portal-popup').classList.remove('visible');
          if (window.stageWebGL) {
            window.stageWebGL.setStageMode('3A');
            window.stageWebGL.morphToShape(this.activeCard.particleShape);
          }
          AudioSynth.startAmbientLoop(this.activeCard.musicStyle);
        } else if (stageId === '3B') {
          lbl.textContent = 'CHẶNG 03B / CON ĐƯỜNG KÝ ỨC';
          document.getElementById('scene-3a-banner').style.display = 'none';
          document.getElementById('scene-3b-controls').style.display = 'flex';

          const vehicleNames = {
            boat: 'THUYỀN GIẤY NGÂN HÀ',
            leaf: 'CHIẾC LÁ MÙA THU',
            glider: 'MÁY BAY GIẤY',
            crane: 'HẠC GIẤY ORIGAMI',
            train: 'ĐOÀN TÀU KÝ ỨC'
          };
          document.getElementById('r-vehicle-status').textContent =
            `HÓA THÂN: ${vehicleNames[this.activeCard.vehicleType] || 'THUYỀN GIẤY'}`;

          if (window.stageWebGL) {
            window.stageWebGL.buildVehicleAvatar(this.activeCard.vehicleType);
            window.stageWebGL.rebuildPhotoPortals(this.activeCard.memories || []);
            window.stageWebGL.setStageMode('3B');
            document.getElementById('spline-progress-slider').value = 0;
            this.onSplineScrub(0);
          }
        }
        lucide.createIcons();
      },

      completeStage1() {
        AudioSynth.playSuccessChord();
        document.getElementById('r-game-status-text').textContent = 'ĐÃ MỞ KHÓA THÀNH CÔNG!';
        setTimeout(() => this.goToStage(2), 550);
      },

      /* ======================================================================
         STAGE 1: 4 PLAYABLE MINI-GAMES
         ====================================================================== */
      renderStage1MiniGame() {
        const mount = document.getElementById('r-game-mount-area');
        const titleEl = document.getElementById('r-game-title');
        const descEl = document.getElementById('r-game-desc');
        const statusEl = document.getElementById('r-game-status-text');
        mount.innerHTML = '';
        statusEl.textContent = 'TIẾN ĐỘ: ĐANG THỰC HIỆN';

        const gameType = this.activeCard.miniGame || 'puzzle';

        if (gameType === 'puzzle') {
          titleEl.textContent = 'Ghép Hình Ký Ức Từ Tính';
          descEl.textContent = 'Chạm vào 2 mảnh ghép bất kỳ để hoán đổi vị trí cho đến khi bức ảnh kỷ niệm hoàn chỉnh.';

          const grid = document.createElement('div');
          grid.className = 'puzzle-grid';
          mount.appendChild(grid);

          // Create shuffled 3x3 array (only 2 swaps away from solved so it's fun & quick!)
          const order = [0, 1, 2, 3, 4, 5, 6, 7, 8];
          // Swap two pairs
          [order[0], order[4]] = [order[4], order[0]];
          [order[2], order[7]] = [order[7], order[2]];

          let firstSelected = null;
          const imgUrl = this.activeCard.puzzleImage || ProceduralArt.createSVGDataURL('KÝ ỨC 20/10', 'LUMINA STUDIO', '#2e1a08', '#0c0804', '#f59e0b');

          const renderTiles = () => {
            grid.innerHTML = '';
            let correctCount = 0;
            order.forEach((pieceIdx, slotIdx) => {
              const tile = document.createElement('div');
              tile.className = 'puzzle-tile';
              if (pieceIdx === slotIdx) {
                tile.classList.add('correct-slot');
                correctCount++;
              }
              if (firstSelected === slotIdx) tile.classList.add('selected-tile');

              const row = Math.floor(pieceIdx / 3);
              const col = pieceIdx % 3;
              tile.style.backgroundImage = `url("${imgUrl}")`;
              tile.style.backgroundPosition = `-${col * 91}px -${row * 91}px`;

              tile.onclick = () => {
                AudioSynth.playTone(440 + slotIdx * 35, 0.15);
                if (firstSelected === null) {
                  firstSelected = slotIdx;
                  renderTiles();
                } else if (firstSelected === slotIdx) {
                  firstSelected = null;
                  renderTiles();
                } else {
                  [order[firstSelected], order[slotIdx]] = [order[slotIdx], order[firstSelected]];
                  firstSelected = null;
                  renderTiles();
                }
              };
              grid.appendChild(tile);
            });

            statusEl.textContent = `KHỚP ĐÚNG: ${correctCount} / 9 MẢNH`;
            if (correctCount === 9) {
              this.completeStage1();
            }
          };
          renderTiles();

        } else if (gameType === 'trivia') {
          titleEl.textContent = 'Đố Vui Thấu Hiểu';
          const questions = (this.activeCard.triviaQuestions && this.activeCard.triviaQuestions.length > 0)
            ? this.activeCard.triviaQuestions
            : StorageEngine.getDefaultSeedCards()[0].triviaQuestions;

          let qIdx = 0;
          const renderQuestion = () => {
            const q = questions[qIdx];
            descEl.textContent = `Câu hỏi ${qIdx + 1}/${questions.length}: ${q.question}`;
            mount.innerHTML = '';
            const list = document.createElement('div');
            list.className = 'trivia-options-list';

            q.options.forEach((optText, idx) => {
              const btn = document.createElement('button');
              btn.className = 'trivia-option-btn';
              btn.innerHTML = `<span class="step-num">${['A', 'B', 'C', 'D'][idx]}</span><span>${optText}</span>`;
              btn.onclick = () => {
                if (idx === Number(q.correctIndex)) {
                  AudioSynth.playTone(660, 0.25);
                  btn.style.borderColor = '#22c55e';
                  btn.style.background = 'rgba(34,197,94,0.2)';
                  qIdx++;
                  if (qIdx >= questions.length) {
                    this.completeStage1();
                  } else {
                    setTimeout(renderQuestion, 450);
                  }
                } else {
                  AudioSynth.playErrorBuzz();
                  gsap.fromTo(btn, { x: -8 }, { x: 0, duration: 0.4, ease: 'elastic.out(1, 0.2)' });
                  statusEl.textContent = `GỢI Ý: ${q.hint || 'Hãy thử suy nghĩ lại nhé!'}`;
                }
              };
              list.appendChild(btn);
            });
            mount.appendChild(list);
          };
          renderQuestion();

        } else if (gameType === 'scratch') {
          titleEl.textContent = 'Thẻ Cào Ánh Kim Bí Mật';
          descEl.textContent = 'Di chuột hoặc miết ngón tay trên lớp nhũ ánh kim để lộ thông điệp mở khóa thiệp.';

          const wrap = document.createElement('div');
          wrap.className = 'scratch-container';
          wrap.innerHTML = `
            <div class="scratch-secret-underlay">
              <div class="font-mono-hud" style="font-size:0.7rem;color:var(--accent-primary);margin-bottom:6px">MẬT MÃ YÊU THƯƠNG</div>
              <div class="font-serif-luxury" style="font-size:1.5rem;font-weight:700;color:var(--text-primary)">
                ${this.activeCard.scratchSecret || '20/10 HẠNH PHÚC RẠNG NGỜI'}
              </div>
            </div>
            <canvas id="scratch-foil-canvas" width="300" height="190"></canvas>
          `;
          mount.appendChild(wrap);

          const canvas = wrap.querySelector('#scratch-foil-canvas');
          const ctx = canvas.getContext('2d');

          // Paint metallic shimmer foil
          const grad = ctx.createLinearGradient(0, 0, 300, 190);
          grad.addColorStop(0, '#a1a1aa');
          grad.addColorStop(0.5, '#e4e4e7');
          grad.addColorStop(1, '#71717a');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, 300, 190);

          ctx.fillStyle = '#27272a';
          ctx.font = '600 13px "JetBrains Mono", monospace';
          ctx.textAlign = 'center';
          ctx.fillText('CÀO LỚP NHŨ ÁNH KIM TẠI ĐÂY', 150, 98);

          let isDrawing = false;
          let scratchedCount = 0;

          const scratchAt = (x, y) => {
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(x, y, 24, 0, Math.PI * 2);
            ctx.fill();
            scratchedCount++;
            const pct = Math.min(100, Math.round((scratchedCount / 42) * 100));
            statusEl.textContent = `ĐÃ CÀO: ${pct}%`;
            if (scratchedCount === 42) {
              this.completeStage1();
            }
          };

          canvas.addEventListener('pointerdown', e => {
            isDrawing = true;
            const r = canvas.getBoundingClientRect();
            scratchAt(e.clientX - r.left, e.clientY - r.top);
          });
          canvas.addEventListener('pointermove', e => {
            if (!isDrawing) return;
            const r = canvas.getBoundingClientRect();
            scratchAt(e.clientX - r.left, e.clientY - r.top);
          });
          window.addEventListener('pointerup', () => { isDrawing = false; });

        } else if (gameType === 'catcher') {
          titleEl.textContent = 'Bắt Mảnh Ghép Ánh Sao';
          const target = Number(this.activeCard.catcherTarget) || 6;
          descEl.textContent = `Di chuyển chuột hoặc ngón tay để điều khiển chiếc giỏ ánh sáng hứng đủ ${target} ngôi sao ký ức.`;

          const canvas = document.createElement('canvas');
          canvas.id = 'catcher-game-canvas';
          canvas.width = 320;
          canvas.height = 240;
          mount.appendChild(canvas);

          const ctx = canvas.getContext('2d');
          let basketX = 160;
          let caught = 0;
          const stars = [
            { x: 60 + Math.random() * 200, y: -10, vy: 1.7 + Math.random() * 1.1 },
            { x: 60 + Math.random() * 200, y: -90, vy: 1.8 + Math.random() * 1.2 }
          ];

          canvas.addEventListener('pointermove', e => {
            const r = canvas.getBoundingClientRect();
            basketX = Math.max(35, Math.min(285, e.clientX - r.left));
          });

          const loop = () => {
            ctx.clearRect(0, 0, 320, 240);

            // Draw glowing basket
            ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent-primary').trim() || '#f59e0b';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(basketX, 212, 28, 0, Math.PI, false);
            ctx.stroke();

            // Update & draw falling geometric stars
            stars.forEach(s => {
              s.y += s.vy;
              ctx.fillStyle = '#ffffff';
              ctx.beginPath();
              ctx.arc(s.x, s.y, 6, 0, Math.PI * 2);
              ctx.fill();

              // Check collision with basket
              if (s.y >= 198 && s.y <= 220 && Math.abs(s.x - basketX) < 32) {
                caught++;
                AudioSynth.playTone(520 + caught * 60, 0.18);
                statusEl.textContent = `ĐÃ HỨNG: ${caught} / ${target} NGÔI SAO`;
                s.y = -20;
                s.x = 30 + Math.random() * 260;
              } else if (s.y > 245) {
                s.y = -15;
                s.x = 30 + Math.random() * 260;
              }
            });

            if (caught >= target) {
              this.completeStage1();
              return;
            }
            this.catcherRAF = requestAnimationFrame(loop);
          };
          this.catcherRAF = requestAnimationFrame(loop);
        }
      },

      /* ======================================================================
         STAGE 2: PHYSICAL GESTURE RECOGNITION WITH PARTICLE TRAIL
         ====================================================================== */
      initStage2GestureCanvas() {
        const canvas = document.getElementById('gesture-interactive-canvas');
        const ctx = canvas.getContext('2d');
        const gestureType = this.activeCard.gestureType || 'windup';
        const titleEl = document.getElementById('r-gesture-title');
        const descEl = document.getElementById('r-gesture-desc');
        const progEl = document.getElementById('r-gesture-progress');

        let progress = 0;
        let isHolding = false;
        let lastAngle = null;
        const trailParticles = [];

        if (gestureType === 'windup') {
          titleEl.textContent = 'Xoay Vòng Lên Dây Cót Ký Ức';
          descEl.textContent = 'Giữ và xoay chuột hoặc ngón tay theo vòng tròn quanh tâm sáng để tích tụ năng lượng 100%.';
        } else if (gestureType === 'heartpath') {
          titleEl.textContent = 'Vẽ Quỹ Đạo Trái Tim Ánh Sáng';
          descEl.textContent = 'Di chuyển chuột hoặc ngón tay lướt theo đường viền trái tim phát sáng để đánh thức không gian 3D.';
        } else {
          titleEl.textContent = 'Nhấn Giữ Truyền Hơi Ấm';
          descEl.textContent = 'Nhấn và giữ vào tâm bông hoa hình học để truyền năng lượng làm nở bung từng tầng cánh sáng.';
        }

        const spawnTrail = (x, y) => {
          for (let i = 0; i < 3; i++) {
            trailParticles.push({
              x, y,
              vx: (Math.random() - 0.5) * 2.2,
              vy: (Math.random() - 0.5) * 2.2,
              alpha: 1,
              size: 2 + Math.random() * 3
            });
          }
        };

        const handlePointerMove = e => {
          const r = canvas.getBoundingClientRect();
          const x = e.clientX - r.left;
          const y = e.clientY - r.top;
          spawnTrail(x, y);

          if (gestureType === 'windup' && isHolding) {
            const angle = Math.atan2(y - 160, x - 160);
            if (lastAngle !== null) {
              let delta = Math.abs(angle - lastAngle);
              if (delta > Math.PI) delta = Math.PI * 2 - delta;
              progress = Math.min(100, progress + delta * 14);
            }
            lastAngle = angle;
          } else if (gestureType === 'heartpath') {
            progress = Math.min(100, progress + 0.9);
          }
        };

        canvas.onpointerdown = e => {
          isHolding = true;
          const r = canvas.getBoundingClientRect();
          spawnTrail(e.clientX - r.left, e.clientY - r.top);
        };
        canvas.onpointermove = handlePointerMove;
        window.onpointerup = () => {
          isHolding = false;
          lastAngle = null;
        };

        const renderGestureLoop = () => {
          ctx.clearRect(0, 0, 320, 320);
          const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent-primary').trim() || '#f59e0b';

          if (gestureType === 'longpress' && isHolding) {
            progress = Math.min(100, progress + 0.85);
            spawnTrail(160 + (Math.random() - 0.5) * 40, 160 + (Math.random() - 0.5) * 40);
          }

          // Draw Guide Geometry
          ctx.save();
          ctx.translate(160, 160);
          ctx.strokeStyle = 'rgba(255,255,255,0.18)';
          ctx.lineWidth = 2;

          if (gestureType === 'heartpath') {
            ctx.beginPath();
            for (let t = 0; t <= Math.PI * 2; t += 0.08) {
              const hx = 5.5 * 16 * Math.pow(Math.sin(t), 3);
              const hy = -5.5 * (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
              if (t === 0) ctx.moveTo(hx, hy);
              else ctx.lineTo(hx, hy);
            }
            ctx.stroke();
          } else {
            // Blooming Sacred Rings
            const petals = 8;
            const radius = 38 + (progress / 100) * 65;
            ctx.strokeStyle = accent;
            for (let i = 0; i < petals; i++) {
              ctx.rotate((Math.PI * 2) / petals);
              ctx.beginPath();
              ctx.ellipse(0, radius * 0.45, 18, radius * 0.55, 0, 0, Math.PI * 2);
              ctx.stroke();
            }
          }
          ctx.restore();

          // Render Particle Trail
          for (let i = trailParticles.length - 1; i >= 0; i--) {
            const p = trailParticles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.alpha -= 0.028;
            if (p.alpha <= 0) {
              trailParticles.splice(i, 1);
              continue;
            }
            ctx.fillStyle = accent;
            ctx.globalAlpha = p.alpha;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.globalAlpha = 1;

          progEl.textContent = `NĂNG LƯỢNG: ${Math.floor(progress)}%`;

          if (progress >= 100) {
            AudioSynth.playSuccessChord();
            this.goToStage('3A');
            return;
          }
          this.gestureRAF = requestAnimationFrame(renderGestureLoop);
        };

        this.gestureRAF = requestAnimationFrame(renderGestureLoop);
      },

      /* ======================================================================
         STAGE 3B: MEMORY LANE SPLINE SCRUBBING & PORTAL TEXT REVEAL
         ====================================================================== */
      onSplineScrub(val) {
        const norm = Number(val) / 1000;
        const pct = Math.round(norm * 100);
        document.getElementById('r-spline-percent').textContent = `HÀNH TRÌNH: ${pct}%`;

        if (window.stageWebGL) {
          window.stageWebGL.updateSplineJourney(norm);
        }

        // At 98%+, automatically trigger firework burst & offer the Grand Letter
        if (pct >= 98 && !this._letterAutoShown) {
          this._letterAutoShown = true;
          this.triggerFireworkBurst();
          setTimeout(() => this.openGrandLetterModal(), 650);
        } else if (pct < 90) {
          this._letterAutoShown = false;
        }
      },

      updateActivePortalHUD(portalObj) {
        const popup = document.getElementById('memory-portal-popup');
        if (!portalObj) {
          popup.classList.remove('visible');
          this.lastPortalIndex = -1;
          return;
        }

        popup.classList.add('visible');
        if (this.lastPortalIndex !== portalObj.index) {
          this.lastPortalIndex = portalObj.index;
          AudioSynth.playTone(587.33 + portalObj.index * 55, 0.35, 'triangle', 0.05);

          document.getElementById('portal-popup-index').textContent = `KHUNG TRANH KÝ ỨC 0${portalObj.index + 1}`;
          document.getElementById('portal-popup-date').textContent = portalObj.memory.date || '20 / 10';

          const capEl = document.getElementById('portal-popup-caption');
          capEl.textContent = portalObj.memory.caption;
          gsap.fromTo(capEl, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power2.out' });
        }
      },

      triggerFireworkBurst() {
        AudioSynth.playSuccessChord();
        if (window.stageWebGL) {
          window.stageWebGL.spawn3DFireworkBurst();
        }
      },

      openGrandLetterModal() {
        if (!this.activeCard) return;
        document.getElementById('letter-modal-recipient').textContent = `Kính Gửi: ${this.activeCard.recipientName}`;
        document.getElementById('letter-modal-body').textContent = this.activeCard.mainLetter;
        document.getElementById('letter-modal-sender').textContent = this.activeCard.senderName;
        App.openModal('modal-grand-letter');
      }
    };

    /* ==========================================================================
       MODULE 6: MAIN STUDIO & PORTAL APPLICATION CONTROLLER
       ========================================================================== */
    const App = {
      cards: [],
      currentUser: null,
      authMode: 'login',
      pendingAuthCallback: null,
      editingCard: null,
      currentStudioStep: 1,

      ThemeColorsMap: {
        mother: ['#f59e0b', '#fde68a', 'MẸ YÊU — HỔ PHÁCH ẤM ÁP'],
        grandma: ['#eab308', '#fef08a', 'BÀ KÍNH YÊU — HOÀNG KIM TÔN KÍNH'],
        friend: ['#38bdf8', '#a5f3fc', 'BẠN BÈ — THANH KHIẾT THIÊN THANH'],
        teacher: ['#c084fc', '#f5d0fe', 'CÔ GIÁO — TÍM NGỌC TRI ÂN'],
        lover: ['#f43f5e', '#fecdd3', 'NGƯỜI YÊU — ĐỎ NHUNG LÃNG MẠN']
      },

      init() {
        this.cards = StorageEngine.loadCards();
        this.currentUser = StorageEngine.getUser();
        this.updateAuthHeaderUI();
        this.updateCardCountUI();

        // Initialize WebGL Canvases
        window.bgWebGL = new LuminaWebGLController('main-webgl-canvas', false);
        window.stageWebGL = new LuminaWebGLController('stage-webgl-canvas', true);

        // Setup UIverse mouse spotlight tracking globally
        this.initSpotlightTracking();

        // Bind Wheel Scroll on Recipient Stage for Scene 3B Spline Journey
        const stageMount = document.getElementById('recipient-stage-mount');
        stageMount.addEventListener('wheel', e => {
          if (RecipientExperience.currentStage === '3B') {
            e.preventDefault();
            const slider = document.getElementById('spline-progress-slider');
            const nextVal = Math.max(0, Math.min(1000, Number(slider.value) + (e.deltaY > 0 ? 38 : -38)));
            slider.value = nextVal;
            RecipientExperience.onSplineScrub(nextVal);
          }
        }, { passive: false });

        // Check URL Query Parameters for ISOLATED QR VIEWER MODE (?mode=view&cardId=xxx)
        this.checkIsolatedViewerURL();

        lucide.createIcons();
      },

      initSpotlightTracking() {
        document.addEventListener('pointermove', e => {
          document.querySelectorAll('.uiverse-btn, .uiverse-card').forEach(el => {
            const rect = el.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            el.style.setProperty('--mouse-x', `${x}px`);
            el.style.setProperty('--mouse-y', `${y}px`);
          });
        });
      },

      /* Checks if opened via QR Code URL (?mode=view&cardId=...) */
      checkIsolatedViewerURL() {
        const params = new URLSearchParams(window.location.search);
        const mode = params.get('mode');
        const cardId = params.get('cardId');
        const payload = params.get('payload');

        if (mode === 'view') {
          let targetCard = this.cards.find(c => c.id === cardId);
          if (!targetCard && payload) {
            targetCard = StorageEngine.decodeCardPayload(payload);
          }
          if (!targetCard) {
            targetCard = this.cards[0];
          }
          // Lock into Full-Screen Isolated Viewer Mode (Hide Header, No Login Required)
          document.body.classList.add('isolated-viewer-mode');
          document.getElementById('main-hud-header').classList.add('hidden-hud');
          document.getElementById('exit-simulation-btn').style.display = 'none';
          this.navigate('studio', true);
          setTimeout(() => {
            window.stageWebGL.resize();
            RecipientExperience.loadCard(targetCard);
          }, 120);
        }
      },

      /* Simulates QR Viewer Mode inside the current session */
      launchIsolatedViewerSimulation(cardToView = null) {
        const card = cardToView || this.editingCard || this.cards[0];
        document.body.classList.add('isolated-viewer-mode');
        document.getElementById('main-hud-header').classList.add('hidden-hud');
        document.getElementById('exit-simulation-btn').style.display = 'inline-flex';
        this.navigate('studio', true);
        setTimeout(() => {
          window.stageWebGL.resize();
          RecipientExperience.loadCard(card);
        }, 120);
      },

      exitIsolatedViewerSimulation() {
        document.body.classList.remove('isolated-viewer-mode');
        document.getElementById('main-hud-header').classList.remove('hidden-hud');
        document.getElementById('exit-simulation-btn').style.display = 'none';
        setTimeout(() => window.stageWebGL.resize(), 120);
      },

      /* ======================================================================
         THEME SWITCHING (SYNCS CSS VARIABLES + WEBGL SHADERS)
         ====================================================================== */
      applyThemePaletteOnly(themeKey) {
        document.documentElement.setAttribute('data-theme', themeKey);
        const info = this.ThemeColorsMap[themeKey] || this.ThemeColorsMap.mother;
        document.getElementById('hud-theme-indicator').textContent = info[2];

        document.querySelectorAll('[data-theme-btn]').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.themeBtn === themeKey);
        });

        if (window.bgWebGL) window.bgWebGL.updateThemeColors(info[0], info[1]);
        if (window.stageWebGL) window.stageWebGL.updateThemeColors(info[0], info[1]);
      },

      setGlobalTheme(themeKey, shapeKey) {
        this.applyThemePaletteOnly(themeKey);
        if (shapeKey && window.bgWebGL) {
          window.bgWebGL.morphToShape(shapeKey);
        }
        AudioSynth.playTone(528, 0.3);
      },

      /* ======================================================================
         AUTHENTICATION GATE
         ====================================================================== */
      requireAuth(callback) {
        if (this.currentUser) {
          callback();
        } else {
          this.pendingAuthCallback = callback;
          this.openAuthModal();
        }
      },

      openAuthModal() {
        this.openModal('modal-auth');
      },

      switchAuthMode(mode) {
        this.authMode = mode;
        const isReg = mode === 'register';
        document.getElementById('auth-name-group').style.display = isReg ? 'block' : 'none';
        document.getElementById('auth-modal-title').textContent = isReg ? 'Đăng Ký Tài Khoản' : 'Đăng Nhập Studio';
        document.getElementById('auth-submit-label').textContent = isReg ? 'Tạo Tài Khoản & Vào Studio' : 'Xác Thực & Vào Studio';
        document.getElementById('tab-login-btn').classList.toggle('uiverse-btn-primary', !isReg);
        document.getElementById('tab-register-btn').classList.toggle('uiverse-btn-primary', isReg);
      },

      submitAuthForm(e) {
        e.preventDefault();
        const email = document.getElementById('auth-input-email').value.trim();
        const name = document.getElementById('auth-input-name').value.trim() || email.split('@')[0];

        this.currentUser = { name, email };
        StorageEngine.setUser(this.currentUser);
        this.updateAuthHeaderUI();
        this.closeModal('modal-auth');
        AudioSynth.playSuccessChord();
        this.toast(`Xin chào Creator ${this.currentUser.name}`);

        if (this.pendingAuthCallback) {
          const cb = this.pendingAuthCallback;
          this.pendingAuthCallback = null;
          cb();
        }
      },

      updateAuthHeaderUI() {
        const lbl = document.getElementById('header-user-label');
        if (this.currentUser) {
          lbl.textContent = this.currentUser.name;
        } else {
          lbl.textContent = 'Đăng Nhập';
        }
      },

      updateCardCountUI() {
        const el = document.getElementById('landing-card-count');
        if (el) el.textContent = this.cards.length;
      },

      /* ======================================================================
         VIEW NAVIGATION & SAVED CARDS DASHBOARD (3D TILT CARDS)
         ====================================================================== */
      navigate(viewName, skipExitSim = false) {
        if (!skipExitSim && document.body.classList.contains('isolated-viewer-mode')) {
          this.exitIsolatedViewerSimulation();
        }

        document.querySelectorAll('.app-view').forEach(v => v.classList.remove('active-view'));
        const target = document.getElementById(`view-${viewName}`);
        if (target) target.classList.add('active-view');

        if (viewName === 'dashboard') {
          this.renderSavedCardsDashboard();
        } else if (viewName === 'studio') {
          setTimeout(() => window.stageWebGL && window.stageWebGL.resize(), 80);
        }
        lucide.createIcons();
      },

      renderSavedCardsDashboard() {
        const grid = document.getElementById('saved-cards-grid');
        grid.innerHTML = '';
        this.updateCardCountUI();

        const themeNames = {
          mother: 'Chủ đề: Mẹ Yêu',
          grandma: 'Chủ đề: Bà Kính Yêu',
          friend: 'Chủ đề: Bạn Bè',
          teacher: 'Chủ đề: Cô Giáo',
          lover: 'Chủ đề: Người Yêu'
        };

        const shapeNames = {
          lotus: 'Đóa Sen 3D',
          heart: 'Trái Tim 3D',
          cloud: 'Đám Mây 3D',
          airplane: 'Máy Bay 3D',
          rose: 'Hoa Hồng 3D'
        };

        this.cards.forEach(card => {
          const el = document.createElement('div');
          el.className = 'uiverse-card tilt-card-3d';
          el.innerHTML = `
            <div>
              <div class="tilt-card-header">
                <span class="hud-badge font-mono-hud">${themeNames[card.theme] || 'Chủ đề 20/10'}</span>
                <span class="font-mono-hud" style="font-size:0.7rem;color:var(--text-muted)">#${card.id.slice(-5)}</span>
              </div>
              <div class="tilt-card-title">${card.title}</div>
              <div style="font-size:0.84rem;color:var(--text-secondary)">
                Người nhận: <strong style="color:var(--text-primary)">${card.recipientName}</strong>
              </div>
              <div class="tilt-card-meta">
                <span class="meta-chip"><i data-lucide="box" style="width:13px;height:13px"></i> ${shapeNames[card.particleShape] || 'Hạt 3D'}</span>
                <span class="meta-chip"><i data-lucide="gamepad-2" style="width:13px;height:13px"></i> Game: ${card.miniGame.toUpperCase()}</span>
                <span class="meta-chip"><i data-lucide="images" style="width:13px;height:13px"></i> ${(card.memories || []).length} Khung ảnh 3D</span>
              </div>
            </div>

            <div class="tilt-card-actions">
              <button class="card-action-btn" onclick="App.previewCardFromDashboard('${card.id}')">
                <i data-lucide="eye" style="width:16px;height:16px"></i>
                <span>Xem Thử</span>
              </button>
              <button class="card-action-btn" onclick="App.editCardInStudio('${card.id}')">
                <i data-lucide="sliders" style="width:16px;height:16px"></i>
                <span>Chỉnh Sửa</span>
              </button>
              <button class="card-action-btn" onclick="App.openQRModalForCard('${card.id}')">
                <i data-lucide="qr-code" style="width:16px;height:16px"></i>
                <span>Mã QR</span>
              </button>
              <button class="card-action-btn danger" onclick="App.deleteCard('${card.id}')">
                <i data-lucide="trash-2" style="width:16px;height:16px"></i>
                <span>Xóa</span>
              </button>
            </div>
          `;

          // 3D Tilt Physics Effect
          el.addEventListener('pointermove', e => {
            const r = el.getBoundingClientRect();
            const nx = (e.clientX - r.left) / r.width - 0.5;
            const ny = (e.clientY - r.top) / r.height - 0.5;
            el.style.transform = `rotateY(${nx * 12}deg) rotateX(${-ny * 12}deg) translateZ(6px)`;
          });
          el.addEventListener('pointerleave', () => {
            el.style.transform = 'rotateY(0deg) rotateX(0deg) translateZ(0px)';
          });

          grid.appendChild(el);
        });

        lucide.createIcons();
      },

      previewCardFromDashboard(cardId) {
        const card = this.cards.find(c => c.id === cardId);
        if (card) this.launchIsolatedViewerSimulation(card);
      },

      deleteCard(cardId) {
        if (this.cards.length <= 1) {
          this.toast('Cần giữ lại ít nhất 1 thiệp mẫu trong kho');
          return;
        }
        this.cards = this.cards.filter(c => c.id !== cardId);
        StorageEngine.saveCards(this.cards);
        this.renderSavedCardsDashboard();
        this.toast('Đã xóa tấm thiệp khỏi kho lưu trữ');
      },

      /* ======================================================================
         SPLIT-SCREEN STUDIO CONFIGURATION & LIVE REAL-TIME SYNC
         ====================================================================== */
      openNewCardStudio() {
        const template = JSON.parse(JSON.stringify(StorageEngine.getDefaultSeedCards()[0]));
        template.id = 'lumina-' + Date.now();
        template.title = 'Thiệp 20/10 Ánh Sáng Mới';
        this.editingCard = template;
        this.populateStudioFormFromDraft();
        this.navigate('studio');
        this.setStudioStep(1);
        RecipientExperience.loadCard(this.editingCard);
      },

      editCardInStudio(cardId) {
        const found = this.cards.find(c => c.id === cardId);
        if (!found) return;
        this.editingCard = JSON.parse(JSON.stringify(found));
        this.populateStudioFormFromDraft();
        this.navigate('studio');
        this.setStudioStep(1);
        RecipientExperience.loadCard(this.editingCard);
      },

      setStudioStep(stepNum) {
        this.currentStudioStep = stepNum;
        document.querySelectorAll('.step-tab').forEach(t => {
          t.classList.toggle('active', Number(t.dataset.step) === stepNum);
        });
        document.querySelectorAll('.studio-step-body').forEach((b, idx) => {
          b.classList.toggle('active', idx + 1 === stepNum);
        });

        // Automatically switch Right Live Preview stage to match the left config step!
        if (stepNum === 1) RecipientExperience.goToStage('3A');
        else if (stepNum === 2) RecipientExperience.goToStage(1);
        else if (stepNum === 3) RecipientExperience.goToStage(2);
        else if (stepNum === 4) RecipientExperience.goToStage('3B');
      },

      prevStudioStep() {
        if (this.currentStudioStep > 1) this.setStudioStep(this.currentStudioStep - 1);
      },

      nextStudioStep() {
        if (this.currentStudioStep < 4) this.setStudioStep(this.currentStudioStep + 1);
      },

      populateStudioFormFromDraft() {
        const c = this.editingCard;
        document.getElementById('cfg-card-title').value = c.title || '';
        document.getElementById('cfg-recipient-name').value = c.recipientName || '';
        document.getElementById('cfg-puzzle-img').value = c.puzzleImage || '';
        document.getElementById('cfg-scratch-code').value = c.scratchSecret || '';
        document.getElementById('cfg-catcher-target').value = c.catcherTarget || 6;
        document.getElementById('cfg-main-letter').value = c.mainLetter || '';
        document.getElementById('cfg-sender-name').value = c.senderName || '';
        document.getElementById('cfg-music-style').value = c.musicStyle || 'harp';

        this.highlightTileGroup('#cfg-theme-grid', c.theme);
        this.highlightTileGroup('#cfg-shape-grid', c.particleShape);
        this.highlightTileGroup('#cfg-game-grid', c.miniGame);
        this.highlightTileGroup('#cfg-gesture-grid', c.gestureType);
        this.highlightTileGroup('#cfg-vehicle-grid', c.vehicleType);

        this.toggleGameSubConfigPanels(c.miniGame);
        this.renderTriviaBuilder();
        this.renderMemoriesBuilder();
      },

      highlightTileGroup(containerSelector, activeVal) {
        document.querySelectorAll(`${containerSelector} .selectable-tile`).forEach(tile => {
          tile.classList.toggle('selected', tile.dataset.val === activeVal);
        });
      },

      selectConfigTile(propName, value) {
        if (!this.editingCard) return;
        this.editingCard[propName] = value;

        const gridMap = {
          theme: '#cfg-theme-grid',
          particleShape: '#cfg-shape-grid',
          miniGame: '#cfg-game-grid',
          gestureType: '#cfg-gesture-grid',
          vehicleType: '#cfg-vehicle-grid'
        };
        this.highlightTileGroup(gridMap[propName], value);

        if (propName === 'theme') {
          this.applyThemePaletteOnly(value);
        } else if (propName === 'particleShape') {
          RecipientExperience.activeCard.particleShape = value;
          RecipientExperience.goToStage('3A');
        } else if (propName === 'miniGame') {
          this.toggleGameSubConfigPanels(value);
          RecipientExperience.activeCard.miniGame = value;
          RecipientExperience.goToStage(1);
        } else if (propName === 'gestureType') {
          RecipientExperience.activeCard.gestureType = value;
          RecipientExperience.goToStage(2);
        } else if (propName === 'vehicleType') {
          RecipientExperience.activeCard.vehicleType = value;
          RecipientExperience.goToStage('3B');
        }

        AudioSynth.playTone(580, 0.15);
      },

      toggleGameSubConfigPanels(gameType) {
        ['puzzle', 'trivia', 'scratch', 'catcher'].forEach(g => {
          const el = document.getElementById(`game-cfg-${g}`);
          if (el) el.style.display = g === gameType ? 'block' : 'none';
        });
      },

      syncDraftFromInputs() {
        if (!this.editingCard) return;
        this.editingCard.title = document.getElementById('cfg-card-title').value;
        this.editingCard.recipientName = document.getElementById('cfg-recipient-name').value;
        this.editingCard.puzzleImage = document.getElementById('cfg-puzzle-img').value;
        this.editingCard.scratchSecret = document.getElementById('cfg-scratch-code').value;
        this.editingCard.catcherTarget = Number(document.getElementById('cfg-catcher-target').value) || 6;
        this.editingCard.mainLetter = document.getElementById('cfg-main-letter').value;
        this.editingCard.senderName = document.getElementById('cfg-sender-name').value;
        this.editingCard.musicStyle = document.getElementById('cfg-music-style').value;

        // Real-time update into Live Interactive Preview
        RecipientExperience.activeCard = JSON.parse(JSON.stringify(this.editingCard));
        document.getElementById('r-recipient-inline').textContent = this.editingCard.recipientName;
        document.getElementById('r-3a-heading').textContent = `Dành Tặng ${this.editingCard.recipientName}`;
        if (RecipientExperience.currentStage === 1) {
          RecipientExperience.renderStage1MiniGame();
        }
      },

      /* Trivia Questions Builder in Step 2 */
      renderTriviaBuilder() {
        const list = document.getElementById('trivia-builder-list');
        list.innerHTML = '';
        const questions = this.editingCard.triviaQuestions || [];

        questions.forEach((q, qIdx) => {
          const box = document.createElement('div');
          box.style.cssText = 'padding:10px;border-radius:10px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08)';
          box.innerHTML = `
            <div style="display:flex;justify-content:space-between;margin-bottom:6px">
              <span class="font-mono-hud" style="font-size:0.68rem;color:var(--accent-secondary)">CÂU HỎI 0${qIdx + 1}</span>
              <button class="uiverse-btn" onclick="App.removeTriviaQuestion(${qIdx})" style="padding:2px 8px;font-size:0.68rem">Xóa</button>
            </div>
            <input type="text" class="uiverse-input" value="${q.question}" placeholder="Nhập câu hỏi..." style="margin-bottom:6px"
              oninput="App.updateTriviaField(${qIdx}, 'question', this.value)" />
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px">
              ${q.options.map((opt, oIdx) => `
                <input type="text" class="uiverse-input" value="${opt}" placeholder="Đáp án ${['A','B','C','D'][oIdx]}"
                  oninput="App.updateTriviaOption(${qIdx}, ${oIdx}, this.value)" />
              `).join('')}
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
              <select class="uiverse-select" onchange="App.updateTriviaField(${qIdx}, 'correctIndex', Number(this.value))">
                <option value="0" ${q.correctIndex == 0 ? 'selected' : ''}>Đáp án đúng: A</option>
                <option value="1" ${q.correctIndex == 1 ? 'selected' : ''}>Đáp án đúng: B</option>
                <option value="2" ${q.correctIndex == 2 ? 'selected' : ''}>Đáp án đúng: C</option>
                <option value="3" ${q.correctIndex == 3 ? 'selected' : ''}>Đáp án đúng: D</option>
              </select>
              <input type="text" class="uiverse-input" value="${q.hint || ''}" placeholder="Gợi ý khi chọn sai..."
                oninput="App.updateTriviaField(${qIdx}, 'hint', this.value)" />
            </div>
          `;
          list.appendChild(box);
        });
      },

      addTriviaQuestion() {
        this.editingCard.triviaQuestions.push({
          question: 'Kỷ niệm đáng nhớ nhất của chúng ta là gì?',
          options: ['Phương án A', 'Phương án B', 'Phương án C', 'Tất cả đều đúng'],
          correctIndex: 3,
          hint: 'Hãy chọn đáp án đầy đủ nhất!'
        });
        this.renderTriviaBuilder();
        this.syncDraftFromInputs();
      },

      removeTriviaQuestion(idx) {
        if (this.editingCard.triviaQuestions.length <= 1) return;
        this.editingCard.triviaQuestions.splice(idx, 1);
        this.renderTriviaBuilder();
        this.syncDraftFromInputs();
      },

      updateTriviaField(qIdx, field, val) {
        this.editingCard.triviaQuestions[qIdx][field] = val;
        this.syncDraftFromInputs();
      },

      updateTriviaOption(qIdx, oIdx, val) {
        this.editingCard.triviaQuestions[qIdx].options[oIdx] = val;
        this.syncDraftFromInputs();
      },

      handlePuzzleImageUpload(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
          document.getElementById('cfg-puzzle-img').value = ev.target.result;
          this.syncDraftFromInputs();
          this.toast('Đã tải ảnh ghép hình lên thành công');
        };
        reader.readAsDataURL(file);
      },

      /* Memories Builder in Step 4 */
      renderMemoriesBuilder() {
        const container = document.getElementById('studio-memories-list');
        container.innerHTML = '';
        const memories = this.editingCard.memories || [];

        memories.forEach((m, idx) => {
          const row = document.createElement('div');
          row.className = 'memory-item-row';
          row.innerHTML = `
            <img src="${m.img}" class="memory-thumb-preview" alt="Memory ${idx + 1}" />
            <div style="display:flex;flex-direction:column;gap:5px">
              <input type="text" class="uiverse-input" value="${m.caption}" placeholder="Lời nhắn gắn với bức ảnh này..."
                style="padding:7px 10px;font-size:0.8rem" oninput="App.updateMemoryItem(${idx}, 'caption', this.value)" />
              <input type="text" class="uiverse-input" value="${m.date || '20 / 10'}" placeholder="Dấu mốc thời gian..."
                style="padding:5px 10px;font-size:0.74rem" oninput="App.updateMemoryItem(${idx}, 'date', this.value)" />
            </div>
            <button class="uiverse-btn" onclick="App.removeMemoryItem(${idx})" style="padding:8px 10px">
              <i data-lucide="trash-2" style="width:14px;height:14px"></i>
            </button>
          `;
          container.appendChild(row);
        });
        lucide.createIcons();
      },

      updateMemoryItem(idx, key, val) {
        this.editingCard.memories[idx][key] = val;
        RecipientExperience.activeCard = JSON.parse(JSON.stringify(this.editingCard));
        if (window.stageWebGL) window.stageWebGL.rebuildPhotoPortals(this.editingCard.memories);
      },

      removeMemoryItem(idx) {
        if (this.editingCard.memories.length <= 1) {
          this.toast('Cần tối thiểu 1 khung ảnh trên Con Đường Ký Ức');
          return;
        }
        this.editingCard.memories.splice(idx, 1);
        this.renderMemoriesBuilder();
        if (window.stageWebGL) window.stageWebGL.rebuildPhotoPortals(this.editingCard.memories);
      },

      addMemorySlotByUrl() {
        const count = this.editingCard.memories.length + 1;
        this.editingCard.memories.push({
          img: ProceduralArt.createSVGDataURL(`KHOẢNH KHẮC 0${count}`, '20 THÁNG 10', '#3b1d38', '#110712', '#f472b6'),
          caption: 'Mỗi bức ảnh là một mảnh ghép ký ức tỏa sáng trên hành trình.',
          date: `Kỷ Niệm 0${count}`
        });
        this.renderMemoriesBuilder();
        if (window.stageWebGL) window.stageWebGL.rebuildPhotoPortals(this.editingCard.memories);
      },

      handleMemoryFilesUpload(e) {
        const files = Array.from(e.target.files || []);
        files.forEach(file => {
          const reader = new FileReader();
          reader.onload = ev => {
            this.editingCard.memories.push({
              img: ev.target.result,
              caption: `Kỷ niệm đáng nhớ (${file.name.replace(/\.[^/.]+$/, '')})`,
              date: '20 Tháng 10'
            });
            this.renderMemoriesBuilder();
            if (window.stageWebGL) window.stageWebGL.rebuildPhotoPortals(this.editingCard.memories);
          };
          reader.readAsDataURL(file);
        });
        this.toast(`Đã thêm ${files.length} bức ảnh vào Con Đường Ký Ức 3D`);
      },

      setPreviewViewport(mode) {
        const mount = document.getElementById('recipient-stage-mount');
        mount.classList.toggle('mobile-frame', mode === 'mobile');
        setTimeout(() => window.stageWebGL && window.stageWebGL.resize(), 480);
      },

      /* ======================================================================
         SAVE CARD & GENERATE HIGH-RES QR CODE MODAL
         ====================================================================== */
      saveCurrentCardAndShowQR() {
        if (!this.editingCard) return;
        this.syncDraftFromInputs();

        const existingIdx = this.cards.findIndex(c => c.id === this.editingCard.id);
        if (existingIdx >= 0) {
          this.cards[existingIdx] = JSON.parse(JSON.stringify(this.editingCard));
        } else {
          this.cards.unshift(JSON.parse(JSON.stringify(this.editingCard)));
        }

        StorageEngine.saveCards(this.cards);
        this.updateCardCountUI();
        this.toast('Đã lưu tấm thiệp 3D thành công!');
        this.openQRModalForCard(this.editingCard.id);
      },

      openQRModalForCard(cardId) {
        const card = this.cards.find(c => c.id === cardId) || this.editingCard;
        if (!card) return;
        this.currentQRCard = card;

        document.getElementById('qr-modal-card-title').textContent = card.title;
        const payload = StorageEngine.encodeCardPayload(card);
        const baseUrl = window.location.origin + window.location.pathname;
        const fullShareUrl = `${baseUrl}?mode=view&cardId=${encodeURIComponent(card.id)}&payload=${payload}`;
        const shortVisualUrl = `${baseUrl}?mode=view&cardId=${encodeURIComponent(card.id)}`;

        document.getElementById('qr-share-url-input').value = fullShareUrl;

        const qrMount = document.getElementById('qr-code-mount');
        qrMount.innerHTML = '';
        new QRCode(qrMount, {
          text: shortVisualUrl,
          width: 200,
          height: 200,
          colorDark: '#09090b',
          colorLight: '#ffffff',
          correctLevel: QRCode.CorrectLevel.M
        });

        this.openModal('modal-qr');
      },

      downloadQRCodeImage() {
        const qrMount = document.getElementById('qr-code-mount');
        const canvas = qrMount.querySelector('canvas');
        const img = qrMount.querySelector('img');
        const dataUrl = canvas ? canvas.toDataURL('image/png') : (img ? img.src : null);
        if (!dataUrl) return;

        const a = document.createElement('a');
        a.href = dataUrl;
        a.download = `QR-Lumina-20-10-${this.currentQRCard ? this.currentQRCard.id : 'card'}.png`;
        a.click();
        this.toast('Đã tải ảnh Mã QR về thiết bị');
      },

      copyShareUrl() {
        const input = document.getElementById('qr-share-url-input');
        navigator.clipboard.writeText(input.value);
        this.toast('Đã sao chép đường dẫn chế độ Người Nhận');
      },

      openIsolatedViewerFromModal() {
        this.closeModal('modal-qr');
        if (this.currentQRCard) {
          this.launchIsolatedViewerSimulation(this.currentQRCard);
        }
      },

      openModal(id) {
        document.getElementById(id).classList.add('open');
        lucide.createIcons();
      },

      closeModal(id) {
        document.getElementById(id).classList.remove('open');
      },

      toast(msg) {
        const container = document.getElementById('toast-container');
        const item = document.createElement('div');
        item.className = 'lumina-toast';
        item.innerHTML = `<i data-lucide="check-circle-2" style="width:16px;height:16px;color:var(--accent-primary)"></i><span>${msg}</span>`;
        container.appendChild(item);
        lucide.createIcons();
        gsap.fromTo(item, { x: 40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35 });
        setTimeout(() => {
          gsap.to(item, {
            opacity: 0,
            y: 12,
            duration: 0.3,
            onComplete: () => item.remove()
          });
        }, 2800);
      }
    };

    window.addEventListener('DOMContentLoaded', () => App.init());
  </script>
</body>
</html>
