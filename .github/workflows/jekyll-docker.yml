              </p>

              <!-- Dynamic Game Mount -->
              <div id="r-game-mount-area" style="margin-top:10px"></div>

              <div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.08)">
                <span class="font-mono-hud" style="font-size:0.7rem;color:var(--text-muted)" id="r-game-status-text">TIẾN ĐỘ: ĐANG THỰC HIỆN</span>
                <button class="uiverse-btn" onclick="RecipientExperience.completeStage1()" style="padding:6px 12px;font-size:0.72rem">
                  <i data-lucide="fast-forward" style="width:13px;height:13px"></i>
                  <span>Mở Khóa Nhanh</span>
                </button>
              </div>
            </div>
          </div>

          <!-- ===============================================================
