<!DOCTYPE html>
<html lang="vi" data-theme="mother">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>LUMINA 20/10 — Interactive Memory & 3D Card Studio</title>

  <!-- Google Fonts: Cormorant Garamond (Luxury Serif), Plus Jakarta Sans (Modern UI), JetBrains Mono (ThreeUI HUD) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Core Libraries: Three.js, GSAP, Lucide Icons, QRCode.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    /* ==========================================================================
       1. DYNAMIC RECIPIENT THEME TOKENS (5 SUBJECT PALETTES)
       ========================================================================== */
    :root,
    [data-theme="mother"] {
      --bg-deep: #0c0906;
      --bg-surface: rgba(24, 18, 12, 0.72);
      --bg-elevated: rgba(38, 28, 18, 0.82);
      --accent-primary: #f59e0b;
      --accent-secondary: #fde68a;
      --accent-tertiary: #ea580c;
      --accent-rgb: 245, 158, 11;
      --accent-2-rgb: 253, 230, 138;
      --text-primary: #fef3c7;
      --text-secondary: rgba(254, 243, 199, 0.68);
      --text-muted: rgba(254, 243, 199, 0.42);
      --border-subtle: rgba(245, 158, 11, 0.22);
      --theme-label: "MẸ YÊU — HỔ PHÁCH ẤM ÁP";
    }

    [data-theme="grandma"] {
      --bg-deep: #0b0806;
      --bg-surface: rgba(27, 20, 14, 0.74);
      --bg-elevated: rgba(42, 31, 21, 0.84);
      --accent-primary: #eab308;
      --accent-secondary: #fef08a;
      --accent-tertiary: #ca8a04;
      --accent-rgb: 234, 179, 8;
      --accent-2-rgb: 254, 240, 138;
      --text-primary: #fefce8;
      --text-secondary: rgba(254, 252, 232, 0.68);
      --text-muted: rgba(254, 252, 232, 0.42);
      --border-subtle: rgba(234, 179, 8, 0.24);
      --theme-label: "BÀ KÍNH YÊU — HOÀNG KIM TÔN KÍNH";
    }

    [data-theme="friend"] {
      --bg-deep: #040914;
      --bg-surface: rgba(10, 22, 42, 0.72);
      --bg-elevated: rgba(16, 34, 64, 0.82);
      --accent-primary: #38bdf8;
      --accent-secondary: #a5f3fc;
      --accent-tertiary: #6366f1;
      --accent-rgb: 56, 189, 248;
      --accent-2-rgb: 165, 243, 252;
      --text-primary: #f0f9ff;
      --text-secondary: rgba(240, 249, 255, 0.68);
      --text-muted: rgba(240, 249, 255, 0.42);
      --border-subtle: rgba(56, 189, 248, 0.24);
      --theme-label: "BẠN BÈ — THANH KHIẾT THIÊN THANH";
    }

    [data-theme="teacher"] {
      --bg-deep: #080612;
      --bg-surface: rgba(20, 15, 38, 0.72);
      --bg-elevated: rgba(32, 24, 58, 0.82);
      --accent-primary: #c084fc;
      --accent-secondary: #f5d0fe;
      --accent-tertiary: #818cf8;
      --accent-rgb: 192, 132, 252;
      --accent-2-rgb: 245, 208, 254;
      --text-primary: #faf5ff;
      --text-secondary: rgba(250, 245, 255, 0.68);
      --text-muted: rgba(250, 245, 255, 0.42);
      --border-subtle: rgba(192, 132, 252, 0.24);
      --theme-label: "CÔ GIÁO — TÍM NGỌC TRI ÂN";
    }

    [data-theme="lover"] {
      --bg-deep: #110408;
      --bg-surface: rgba(32, 10, 18, 0.72);
      --bg-elevated: rgba(48, 14, 28, 0.82);
      --accent-primary: #f43f5e;
      --accent-secondary: #fecdd3;
      --accent-tertiary: #e11d48;
      --accent-rgb: 244, 63, 94;
      --accent-2-rgb: 254, 205, 211;
      --text-primary: #fff1f2;
      --text-secondary: rgba(255, 241, 242, 0.68);
      --text-muted: rgba(255, 241, 242, 0.42);
      --border-subtle: rgba(244, 63, 94, 0.25);
      --theme-label: "NGƯỜI YÊU — ĐỎ NHUNG LÃNG MẠN";
    }

    /* ==========================================================================
       2. GLOBAL RESET & TYPOGRAPHY (THREEUI + UIVERSE SYSTEM)
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-deep);
      color: var(--text-primary);
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: background-color 0.8s cubic-bezier(0.22, 1, 0.36, 1), color 0.6s ease;
    }

    .font-serif-luxury {
      font-family: 'Cormorant Garamond', Georgia, serif;
    }

    .font-mono-hud {
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* Normalize Lucide Stroke Width to 1.5px globally */
    svg.lucide {
      stroke-width: 1.5px;
      flex-shrink: 0;
    }

    /* Scrollbar styling for Studio panels */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(var(--accent-rgb), 0.35);
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(var(--accent-rgb), 0.65);
    }

    /* ==========================================================================
       3. UIVERSE.IO COMPONENTS: ANIMATED BORDER, SPOTLIGHT, GLASSMORPHISM
       ========================================================================== */
    @keyframes spinBorder {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.45; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.04); }
    }

    .uiverse-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 24px;
      border-radius: 999px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.88rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--text-primary);
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                  box-shadow 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                  border-color 0.45s ease;
      box-shadow: 0 8px 30px -6px rgba(0, 0, 0, 0.5),
                  inset 0 1px 0 0 rgba(255, 255, 255, 0.12);
    }

    /* Animated glowing border beam on primary UIverse button */
    .uiverse-btn-primary {
      background: linear-gradient(135deg, rgba(var(--accent-rgb), 0.25), rgba(var(--accent-rgb), 0.06));
      border-color: rgba(var(--accent-rgb), 0.55);
      box-shadow: 0 10px 32px -6px rgba(var(--accent-rgb), 0.32),
                  inset 0 1px 1px rgba(255, 255, 255, 0.22);
    }

    .uiverse-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(
        180px circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
        rgba(var(--accent-rgb), 0.32),
        transparent 70%
      );
      opacity: 0;
      transition: opacity 0.35s ease;
      pointer-events: none;
    }

    .uiverse-btn:hover {
      transform: translateY(-2px) scale(1.015);
      border-color: rgba(var(--accent-rgb), 0.85);
      box-shadow: 0 14px 36px -6px rgba(var(--accent-rgb), 0.42),
                  inset 0 1px 1px rgba(255, 255, 255, 0.28);
    }

    .uiverse-btn:hover::before {
      opacity: 1;
    }

    .uiverse-btn:active {
      transform: translateY(1px) scale(0.985);
    }

    /* UIverse Card with Mouse Spotlight & Glassmorphism */
    .uiverse-card {
      position: relative;
      background: var(--bg-surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      overflow: hidden;
      transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1),
                  border-color 0.4s ease,
                  box-shadow 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: 0 20px 50px -15px rgba(0, 0, 0, 0.65),
                  inset 0 1px 0 0 rgba(255, 255, 255, 0.09);
    }

    .uiverse-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(
        380px circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
        rgba(var(--accent-rgb), 0.14),
        transparent 65%
      );
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
      z-index: 0;
    }

    .uiverse-card:hover::after {
      opacity: 1;
    }

    .uiverse-card:hover {
      border-color: rgba(var(--accent-rgb), 0.5);
      box-shadow: 0 24px 60px -12px rgba(var(--accent-rgb), 0.18),
                  inset 0 1px 0 0 rgba(255, 255, 255, 0.16);
    }

    .uiverse-card > * {
      position: relative;
      z-index: 1;
    }

    /* UIverse Input & Textarea */
    .uiverse-input,
    .uiverse-textarea,
    .uiverse-select {
      width: 100%;
      padding: 11px 15px;
      background: rgba(0, 0, 0, 0.34);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      color: var(--text-primary);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.88rem;
      outline: none;
      transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      user-select: text;
    }

    .uiverse-input:focus,
    .uiverse-textarea:focus,
    .uiverse-select:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.18),
                  0 6px 20px -4px rgba(var(--accent-rgb), 0.25);
      background: rgba(0, 0, 0, 0.52);
    }

    .uiverse-label {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.76rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-secondary);
      margin-bottom: 7px;
    }

    /* ==========================================================================
       4. THREEUI.COM FLOATING HUD & NAVIGATION OVERLAY
       ========================================================================== */
    #main-webgl-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: auto;
    }

    /* ThreeUI Top Floating HUD Bar */
    .threeui-header {
      position: fixed;
      top: 18px;
      left: 24px;
      right: 24px;
      height: 60px;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: var(--bg-surface);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid var(--border-subtle);
      border-radius: 999px;
      box-shadow: 0 15px 40px -10px rgba(0, 0, 0, 0.6);
      transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.5s ease;
    }

    .threeui-header.hidden-hud {
      transform: translateY(-120%);
      opacity: 0;
      pointer-events: none;
    }

    .brand-cluster {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .brand-emblem {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 30% 30%, var(--accent-primary), transparent 75%);
      border: 1px solid rgba(var(--accent-rgb), 0.6);
      box-shadow: 0 0 20px rgba(var(--accent-rgb), 0.4);
    }

    .brand-title {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 700;
      font-size: 1.35rem;
      letter-spacing: 0.06em;
      color: var(--text-primary);
    }

    .hud-telemetry {
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 0.72rem;
      color: var(--text-secondary);
    }

    .hud-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 999px;
      background: rgba(var(--accent-rgb), 0.12);
      border: 1px solid rgba(var(--accent-rgb), 0.32);
      color: var(--accent-secondary);
      font-size: 0.7rem;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-primary);
      box-shadow: 0 0 10px var(--accent-primary);
      animation: pulseGlow 2s infinite;
    }

    /* ==========================================================================
       5. VIEW SCREENS MANAGEMENT (LANDING, DASHBOARD, STUDIO, ISOLATED VIEWER)
       ========================================================================== */
    .app-view {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      opacity: 0;
      transition: opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
    }

    .app-view.active-view {
      display: flex;
      opacity: 1;
      pointer-events: auto;
    }

    /* --- VIEW 1: LANDING PORTAL --- */
    #view-landing {
      flex-direction: column;
      justify-content: space-between;
      padding: 104px 40px 36px;
      pointer-events: none;
    }

    .landing-hero-center {
      max-width: 780px;
      margin: auto;
      text-align: center;
      pointer-events: auto;
    }

    .hero-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border-radius: 999px;
      background: rgba(var(--accent-rgb), 0.12);
      border: 1px solid rgba(var(--accent-rgb), 0.35);
      font-size: 0.73rem;
      color: var(--accent-secondary);
      margin-bottom: 20px;
    }

    .hero-headline {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.6rem, 5.4vw, 4.6rem);
      font-weight: 600;
      line-height: 1.06;
      margin-bottom: 18px;
      background: linear-gradient(135deg, #ffffff 15%, var(--accent-secondary) 60%, var(--accent-primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 15px 40px rgba(0, 0, 0, 0.45);
    }

    .hero-subtext {
      font-size: 1rem;
      line-height: 1.65;
      color: var(--text-secondary);
      max-width: 620px;
      margin: 0 auto 30px;
    }

    .hero-cta-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 34px;
    }

    .theme-quick-switcher {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px;
      border-radius: 999px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      backdrop-filter: blur(20px);
    }

    .theme-pill {
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--text-secondary);
      background: transparent;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .theme-pill.active {
      background: rgba(var(--accent-rgb), 0.22);
      color: var(--text-primary);
      border-color: rgba(var(--accent-rgb), 0.55);
      box-shadow: 0 0 16px rgba(var(--accent-rgb), 0.25);
    }

    .landing-feature-strip {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      max-width: 1120px;
      width: 100%;
      margin: 0 auto;
      pointer-events: auto;
    }

    .feature-mini-card {
      padding: 18px 20px;
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    .feature-icon-box {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: rgba(var(--accent-rgb), 0.14);
      border: 1px solid rgba(var(--accent-rgb), 0.35);
      color: var(--accent-primary);
    }

    /* --- VIEW 2: SAVED CARDS DASHBOARD (3D TILT CARDS) --- */
    #view-dashboard {
      flex-direction: column;
      padding: 96px 40px 40px;
      overflow-y: auto;
      background: radial-gradient(circle at 50% 0%, rgba(var(--accent-rgb), 0.12), rgba(0, 0, 0, 0.78) 70%);
      backdrop-filter: blur(10px);
    }

    .dashboard-container {
      max-width: 1240px;
      width: 100%;
      margin: 0 auto;
    }

    .dashboard-top-bar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .cards-grid-3d {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 24px;
      perspective: 1200px;
    }

    .tilt-card-3d {
      padding: 24px;
      transform-style: preserve-3d;
      will-change: transform;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 290px;
      transition: transform 0.18s ease-out, border-color 0.35s ease;
    }

    .tilt-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 14px;
    }

    .tilt-card-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.65rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .tilt-card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 14px 0 20px;
    }

    .meta-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.73rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-secondary);
    }

    .tilt-card-actions {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .card-action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 9px 6px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.09);
      color: var(--text-secondary);
      font-size: 0.7rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .card-action-btn:hover {
      background: rgba(var(--accent-rgb), 0.2);
      border-color: rgba(var(--accent-rgb), 0.55);
      color: var(--text-primary);
      transform: translateY(-2px);
    }

    .card-action-btn.danger:hover {
      background: rgba(239, 68, 68, 0.22);
      border-color: rgba(239, 68, 68, 0.6);
      color: #fca5a5;
    }

    /* --- VIEW 3: SPLIT-SCREEN STUDIO (LEFT CONFIG, RIGHT LIVE PREVIEW) --- */
    #view-studio {
      padding: 88px 24px 20px;
      gap: 20px;
      background: rgba(5, 5, 8, 0.86);
      backdrop-filter: blur(18px);
    }

    .studio-left-panel {
      width: 47%;
      min-width: 430px;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    .studio-right-panel {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 16px;
    }

    /* 4-Step Stepper Navigation */
    .studio-stepper {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }

    .step-tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-secondary);
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .step-tab.active {
      background: rgba(var(--accent-rgb), 0.2);
      border-color: rgba(var(--accent-rgb), 0.65);
      color: var(--text-primary);
      box-shadow: 0 6px 20px -4px rgba(var(--accent-rgb), 0.3);
    }

    .step-num {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, 0.08);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
    }

    .step-tab.active .step-num {
      background: var(--accent-primary);
      color: #000;
      font-weight: 700;
    }

    .studio-step-body {
      flex: 1;
      overflow-y: auto;
      padding-right: 6px;
      display: none;
      flex-direction: column;
      gap: 16px;
    }

    .studio-step-body.active {
      display: flex;
    }

    .option-grid-selector {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
      gap: 10px;
    }

    .selectable-tile {
      padding: 12px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: all 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .selectable-tile:hover {
      border-color: rgba(var(--accent-rgb), 0.45);
      background: rgba(var(--accent-rgb), 0.08);
    }

    .selectable-tile.selected {
      background: rgba(var(--accent-rgb), 0.22);
      border-color: var(--accent-primary);
      color: var(--text-primary);
      box-shadow: 0 8px 24px -6px rgba(var(--accent-rgb), 0.35);
    }

    .selectable-tile-title {
      font-size: 0.82rem;
      font-weight: 600;
    }

    .selectable-tile-sub {
      font-size: 0.7rem;
      color: var(--text-muted);
      line-height: 1.35;
    }

    .studio-footer-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 14px;
      margin-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.09);
    }

    /* Live Interactive Preview Viewport */
    .preview-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .preview-stage-pills {
      display: flex;
      gap: 6px;
      background: rgba(0, 0, 0, 0.35);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .preview-stage-btn {
      padding: 6px 10px;
      border-radius: 7px;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-secondary);
      background: transparent;
      border: none;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .preview-stage-btn.active {
      background: rgba(var(--accent-rgb), 0.25);
      color: var(--text-primary);
    }

    .preview-viewport-wrapper {
      flex: 1;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at center, rgba(var(--accent-rgb), 0.08), rgba(0, 0, 0, 0.65));
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      overflow: hidden;
      position: relative;
      padding: 12px;
    }

    /* Container that holds the Interactive Recipient Stage (shared between Live Preview & Fullscreen Viewer) */
    #recipient-stage-mount {
      width: 100%;
      height: 100%;
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      background: var(--bg-deep);
      border: 1px solid rgba(var(--accent-rgb), 0.35);
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.75);
      transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                  height 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                  border-radius 0.45s ease;
    }

    #recipient-stage-mount.mobile-frame {
      width: 375px;
      max-width: 100%;
      height: 96%;
      border-radius: 34px;
      border: 6px solid rgba(255, 255, 255, 0.14);
    }

    /* When in Full-Screen Isolated Viewer Mode */
    body.isolated-viewer-mode #recipient-stage-mount {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      border-radius: 0 !important;
      border: none !important;
      z-index: 90 !important;
    }

    /* ==========================================================================
       6. RECIPIENT 3-STAGE EXPERIENCE (MINI-GAME -> GESTURE -> 3D JOURNEY)
       ========================================================================== */
    .stage-canvas-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .recipient-hud-top {
      position: absolute;
      top: 16px;
      left: 18px;
      right: 18px;
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
    }

    .recipient-hud-top > * {
      pointer-events: auto;
    }

    .stage-progress-steps {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      border-radius: 999px;
      background: var(--bg-surface);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      font-size: 0.72rem;
    }

    .stage-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      transition: all 0.35s ease;
    }

    .stage-dot.active {
      width: 24px;
      border-radius: 999px;
      background: var(--accent-primary);
      box-shadow: 0 0 12px var(--accent-primary);
    }

    /* Stage Overlay Screens (Stage 1, Stage 2, Stage 3 HUD) */
    .recipient-substage {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 64px 20px 24px;
    }

    .recipient-substage.active {
      display: flex;
    }

    /* --- STAGE 1: MINI-GAME CONTAINERS --- */
    .minigame-card {
      max-width: 500px;
      width: 100%;
      padding: 24px;
      text-align: center;
    }

    /* Game 1: Sliding / Magnetic Jigsaw Puzzle */
    .puzzle-grid {
      width: 285px;
      height: 285px;
      margin: 16px auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 5px;
      padding: 6px;
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid var(--border-subtle);
    }

    .puzzle-tile {
      border-radius: 8px;
      cursor: pointer;
      background-size: 273px 273px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      position: relative;
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .puzzle-tile.selected-tile {
      transform: scale(0.92);
      border-color: var(--accent-primary);
      box-shadow: 0 0 18px var(--accent-primary);
      z-index: 2;
    }

    .puzzle-tile.correct-slot {
      border-color: rgba(var(--accent-rgb), 0.7);
    }

    /* Game 2: Trivia Quiz */
    .trivia-options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 16px;
      text-align: left;
    }

    .trivia-option-btn {
      padding: 12px 16px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-primary);
      font-size: 0.88rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.25s ease;
    }

    .trivia-option-btn:hover {
      background: rgba(var(--accent-rgb), 0.16);
      border-color: var(--accent-primary);
    }

    /* Game 3: Scratch Card */
    .scratch-container {
      position: relative;
      width: 300px;
      height: 190px;
      margin: 16px auto;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border-subtle);
      background: radial-gradient(circle at center, rgba(var(--accent-rgb), 0.28), rgba(0, 0, 0, 0.85));
      display: grid;
      place-items: center;
    }

    .scratch-secret-underlay {
      padding: 18px;
      text-align: center;
    }

    #scratch-foil-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      touch-action: none;
    }

    /* Game 4: Memory Star Catcher */
    #catcher-game-canvas {
      width: 320px;
      height: 250px;
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid var(--border-subtle);
      margin: 12px auto;
      display: block;
      touch-action: none;
      cursor: ew-resize;
    }

    /* --- STAGE 2: GESTURE INTERACTION CANVAS --- */
    #gesture-interactive-canvas {
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: radial-gradient(circle at center, rgba(var(--accent-rgb), 0.16), rgba(0, 0, 0, 0.65) 72%);
      border: 1px solid rgba(var(--accent-rgb), 0.35);
      box-shadow: 0 0 60px rgba(var(--accent-rgb), 0.2);
      cursor: pointer;
      touch-action: none;
      margin: 14px auto;
    }

    /* --- STAGE 3: 3D PARTICLE & MEMORY LANE HUD --- */
    #substage-3-hud {
      justify-content: space-between;
      pointer-events: none;
    }

    #substage-3-hud > * {
      pointer-events: auto;
    }

    /* Floating Memory Caption Card when approaching a 3D Photo Portal */
    .memory-portal-popup {
      max-width: 440px;
      width: 92%;
      padding: 18px 22px;
      margin-top: auto;
      margin-bottom: 18px;
      opacity: 0;
      transform: translateY(20px) scale(0.96);
      transition: all 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
    }

    .memory-portal-popup.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .journey-scrubber-bar {
      max-width: 560px;
      width: 94%;
      padding: 14px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .spline-range-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      outline: none;
      cursor: pointer;
    }

    .spline-range-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent-primary);
      border: 2px solid #fff;
      box-shadow: 0 0 16px var(--accent-primary);
      cursor: grab;
      transition: transform 0.2s ease;
    }

    .spline-range-slider::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    /* ==========================================================================
       7. MODALS: AUTH GATE, QR GENERATOR, & FINAL 20/10 GRAND LETTER
       ========================================================================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 120;
      background: rgba(3, 3, 6, 0.78);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      display: none;
       place-items: center;
      padding: 20px;
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    .modal-backdrop.open {
      display: grid;
      opacity: 1;
    }

    .modal-box {
      max-width: 460px;
      width: 100%;
      padding: 30px;
      position: relative;
    }

    .modal-close-btn {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-secondary);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .modal-close-btn:hover {
      background: rgba(var(--accent-rgb), 0.22);
      color: var(--text-primary);
      border-color: var(--accent-primary);
    }

    /* Grand 20/10 Letter Modal */
    .grand-letter-modal {
      max-width: 620px;
      width: 100%;
      padding: 40px 36px;
      border: 1px solid rgba(var(--accent-rgb), 0.6);
      box-shadow: 0 30px 90px rgba(var(--accent-rgb), 0.28);
      max-height: 88vh;
      overflow-y: auto;
    }

    .letter-body-prose {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.32rem;
      line-height: 1.75;
      color: var(--text-primary);
      white-space: pre-line;
      margin: 22px 0;
      padding: 20px 0;
      border-top: 1px solid rgba(var(--accent-rgb), 0.25);
      border-bottom: 1px solid rgba(var(--accent-rgb), 0.25);
    }

    #qr-code-mount {
      background: #ffffff;
      padding: 16px;
      border-radius: 16px;
      width: fit-content;
      margin: 18px auto;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5);
    }

    /* Memory List Item in Studio Step 4 */
    .memory-item-row {
      display: grid;
      grid-template-columns: 64px 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 10px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.09);
    }

    .memory-thumb-preview {
      width: 64px;
      height: 64px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid var(--border-subtle);
    }

    /* Toast Notification */
    #toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }

    .lumina-toast {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 18px;
      border-radius: 12px;
      background: var(--bg-elevated);
      border: 1px solid var(--accent-primary);
      color: var(--text-primary);
      font-size: 0.84rem;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(16px);
    }

    /* Responsive Adjustments */
    @media (max-width: 1024px) {
      #view-studio {
        flex-direction: column;
        overflow-y: auto;
      }
      .studio-left-panel,
      .studio-right-panel {
        width: 100%;
        min-width: 0;
        height: auto;
      }
      .preview-viewport-wrapper {
        min-height: 540px;
      }
      .landing-feature-strip {
        grid-template-columns: 1fr;
      }
      .hud-telemetry {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- ==========================================================================
       BACKGROUND 3D WEBGL CANVAS (SHARED AMBIENT & FULLSCREEN STAGE)
       ========================================================================== -->
  <canvas id="main-webgl-canvas"></canvas>

  <!-- ==========================================================================
       THREEUI FLOATING TOP HUD HEADER (HIDDEN IN ISOLATED QR VIEWER MODE)
       ========================================================================== -->
  <header class="threeui-header" id="main-hud-header">
    <div class="brand-cluster" onclick="App.navigate('landing')">
      <div class="brand-emblem">
        <i data-lucide="sparkles" style="width:18px;height:18px;color:var(--accent-secondary)"></i>
      </div>
      <div>
        <div class="brand-title">LUMINA 20/10</div>
        <div class="font-mono-hud" style="font-size:0.62rem;color:var(--text-muted)">3D MEMORY & CARD STUDIO</div>
      </div>
    </div>

    <div class="hud-telemetry">
      <div class="hud-badge">
        <span class="status-dot"></span>
        <span class="font-mono-hud" id="hud-theme-indicator">MẸ YÊU — HỔ PHÁCH ẤM ÁP</span>
      </div>
      <span class="font-mono-hud" id="hud-coords-readout">CAM: 0.00, 1.20, 14.00</span>
    </div>

    <div style="display:flex;align-items:center;gap:10px">
      <button class="uiverse-btn" onclick="App.requireAuth(() => App.navigate('dashboard'))" style="padding:9px 16px;font-size:0.8rem">
        <i data-lucide="layers" style="width:16px;height:16px"></i>
        <span>Kho Thiệp Đã Tạo</span>
      </button>
      <button class="uiverse-btn uiverse-btn-primary" onclick="App.requireAuth(() => App.openNewCardStudio())" style="padding:9px 18px;font-size:0.8rem">
        <i data-lucide="wand-2" style="width:16px;height:16px"></i>
        <span>Tạo Thiệp Mới</span>
      </button>
      <button class="uiverse-btn" id="header-auth-btn" onclick="App.openAuthModal()" style="padding:9px 15px;font-size:0.8rem">
        <i data-lucide="user-check" style="width:16px;height:16px"></i>
        <span id="header-user-label">Đăng Nhập</span>
      </button>
    </div>
  </header>

  <!-- ==========================================================================
       VIEW 1: CREATOR PORTAL LANDING PAGE
       ========================================================================== -->
  <section class="app-view active-view" id="view-landing">
    <div class="landing-hero-center">
      <div class="hero-eyebrow font-mono-hud">
        <i data-lucide="compass" style="width:14px;height:14px"></i>
        <span>VIETNAMESE WOMEN'S DAY 20/10 — WEBGL EXPERIENCE</span>
      </div>

      <h1 class="hero-headline">
        Kiến Tạo Hành Trình Ký Ức 3D Dành Tặng Người Phụ Nữ Trân Quý
      </h1>

      <p class="hero-subtext">
        Kết hợp nghệ thuật hạt 3D biến hình, trò chơi tương tác mở khóa và con đường ký ức 
        <span class="font-mono-hud" style="font-size:0.82rem;color:var(--accent-secondary)">Catmull-Rom Spline</span> 
        độc bản. Xuất bản tức thì qua mã QR với chế độ thưởng thức toàn màn hình độc lập.
      </p>

      <div class="hero-cta-group">
        <button class="uiverse-btn uiverse-btn-primary" onclick="App.requireAuth(() => App.openNewCardStudio())" style="padding:15px 30px;font-size:0.96rem">
          <i data-lucide="plus-circle" style="width:19px;height:19px"></i>
          <span>Tạo Thiệp Mới Ngay</span>
        </button>
        <button class="uiverse-btn" onclick="App.requireAuth(() => App.navigate('dashboard'))" style="padding:15px 28px;font-size:0.96rem">
          <i data-lucide="folder-heart" style="width:19px;height:19px"></i>
          <span>Kho Thiệp Đã Tạo (<span id="landing-card-count">3</span>)</span>
        </button>
      </div>

      <!-- Real-time Theme Preview Bar -->
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
        <span class="font-mono-hud" style="font-size:0.68rem;color:var(--text-muted)">CHỌN BẢNG MÀU & HÌNH KHỐI HẠT 3D THEO ĐỐI TƯỢNG</span>
        <div class="theme-quick-switcher">
          <button class="theme-pill active" data-theme-btn="mother" onclick="App.setGlobalTheme('mother', 'lotus')">Mẹ Yêu</button>
          <button class="theme-pill" data-theme-btn="grandma" onclick="App.setGlobalTheme('grandma', 'lotus')">Bà Kính Yêu</button>
          <button class="theme-pill" data-theme-btn="friend" onclick="App.setGlobalTheme('friend', 'cloud')">Bạn Bè</button>
          <button class="theme-pill" data-theme-btn="teacher" onclick="App.setGlobalTheme('teacher', 'airplane')">Cô Giáo</button>
          <button class="theme-pill" data-theme-btn="lover" onclick="App.setGlobalTheme('lover', 'heart')">Người Yêu</button>
        </div>
      </div>
    </div>

    <div class="landing-feature-strip">
      <div class="uiverse-card feature-mini-card">
        <div class="feature-icon-box"><i data-lucide="puzzle" style="width:20px;height:20px"></i></div>
        <div>
          <div style="font-weight:600;font-size:0.92rem;margin-bottom:4px">Chặng 1: 4 Mini-Game Mở Khóa</div>
          <div style="font-size:0.8rem;color:var(--text-secondary);line-height:1.5">Ghép ảnh kỷ niệm từ tính, Đố vui thấu hiểu tùy biến, Thẻ cào ánh kim Canvas và Hứng sao ký ức.</div>
        </div>
      </div>
      <div class="uiverse-card feature-mini-card">
        <div class="feature-icon-box"><i data-lucide="fingerprint" style="width:20px;height:20px"></i></div>
        <div>
          <div style="font-weight:600;font-size:0.92rem;margin-bottom:4px">Chặng 2: Cử Chỉ Vật Lý Phát Sáng</div>
          <div style="font-size:0.8rem;color:var(--text-secondary);line-height:1.5">Xoay vòng lên dây cót, vẽ đường dẫn trái tim ánh sáng hoặc nhấn giữ truyền hơi ấm nở hoa.</div>
        </div>
      </div>
      <div class="uiverse-card feature-mini-card">
        <div class="feature-icon-box"><i data-lucide="orbit" style="width:20px;height:20px"></i></div>
        <div>
          <div style="font-weight:600;font-size:0.92rem;margin-bottom:4px">Chặng 3: Hóa Thân & Con Đường 3D</div>
          <div style="font-size:0.8rem;color:var(--text-secondary);line-height:1.5">8.000 hạt biến hình đa dạng và lướt qua khung tranh 3D cùng Chiếc lá, Thuyền giấy, Hạc giấy, Tàu hỏa.</div>
        </div>
      </div>
    </div>
  </section>

  <!-- ==========================================================================
       VIEW 2: SAVED CARDS DASHBOARD (3D TILT CARDS + QR + EDIT)
       ========================================================================== -->
  <section class="app-view" id="view-dashboard">
    <div class="dashboard-container">
      <div class="dashboard-top-bar">
        <div>
          <div class="font-mono-hud" style="font-size:0.74rem;color:var(--accent-primary);margin-bottom:6px">CREATOR WORKSPACE</div>
          <h2 class="font-serif-luxury" style="font-size:2.4rem;font-weight:600">Kho Thiệp 3D Đã Tạo</h2>
        </div>
        <div style="display:flex;gap:12px">
          <button class="uiverse-btn" onclick="App.navigate('landing')">
            <i data-lucide="arrow-left" style="width:16px;height:16px"></i>
            <span>Trang Chủ</span>
          </button>
          <button class="uiverse-btn uiverse-btn-primary" onclick="App.openNewCardStudio()">
            <i data-lucide="plus" style="width:16px;height:16px"></i>
            <span>Tạo Thiệp 20/10 Mới</span>
          </button>
        </div>
      </div>

      <div class="cards-grid-3d" id="saved-cards-grid">
        <!-- Populated dynamically via JS with 3D perspective tilt listeners -->
      </div>
    </div>
  </section>

  <!-- ==========================================================================
       VIEW 3: SPLIT-SCREEN STUDIO (LEFT: 4-STEP CONFIG, RIGHT: LIVE PREVIEW)
       ========================================================================== -->
  <section class="app-view" id="view-studio">
    <!-- LEFT HALF: 4-STEP CONFIGURATION -->
    <div class="uiverse-card studio-left-panel">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
        <div>
          <span class="font-mono-hud" style="font-size:0.68rem;color:var(--accent-primary)">SPLIT-SCREEN STUDIO</span>
