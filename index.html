<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Aurora - Hệ Thống Kiểm Tra Trực Tuyến</title>
  <link rel="icon" id="webFavicon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='78' font-size='80'%3E📚%3C/text%3E%3C/svg%3E">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent
    }

    body {
      background: #f4f7f6;
      color: #333
    }

    .navbar {
      background: linear-gradient(135deg, #1877f2, #0d5fd6);
      color: #fff;
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .1);
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: .5px;
    }

    .container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .04);
      border: 1px solid #eaeaea;
    }

    .btn {
      background: #1877f2;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: all .2s;
    }

    .btn:hover {
      background: #166fe5;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(24, 119, 242, .2);
    }
  </style>
</head>

<body>
  <nav class="navbar">
    <div class="logo">Aurora - Kiểm Tra Trực Tuyến</div>
  </nav>

  <div class="container">
    <div class="card">
      <h2>Chào mừng đến với hệ thống kiểm tra</h2>
      <p style="margin-top: 10px; color: #666; line-height: 1.6;">
        Hệ thống đã được cập nhật giao diện theo phong cách hiện đại, trực quan và tối ưu trải nghiệm người dùng.
      </p>
    </div>
  </div>
</body>

</html>
