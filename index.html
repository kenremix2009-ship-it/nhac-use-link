<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xương Rồng (Intro) - Dangrangto</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .player-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            width: 350px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }
        .album-art {
            width: 180px;
            height: 180px;
            background: linear-gradient(45deg, #e94560, #ff6b6b);
            border-radius: 50%;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 20px rgba(233, 69, 96, 0.3);
            animation: rotate 20s linear infinite paused;
        }
        .album-art.playing {
            animation-play-state: running;
        }
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .album-art span {
            font-size: 60px;
        }
        h2 {
            font-size: 1.2rem;
            margin-bottom: 8px;
            font-weight: 600;
        }
        p {
            font-size: 0.9rem;
            color: #b2bec3;
            margin-bottom: 25px;
        }
        audio {
            width: 100%;
            outline: none;
            border-radius: 30px;
        }
        audio::-webkit-media-controls-panel {
            background-color: rgba(255, 255, 255, 0.9);
        }
    </style>
</head>
<body>

    <div class="player-card">
        <div class="album-art" id="albumArt">
            <span>🌵</span>
        </div>
        <h2>Xương Rồng (Intro)</h2>
        <p>Dangrangto (Prod. DONAL)</p>
        
        <!-- Thay tên file nhạc chuẩn xác của bạn vào thuộc tính src -->
        <audio id="audioPlayer" controls>
            <source src="./Dangrangto - 'xương rồng (intro)' (Prod. DONAL) - Dangrangto (youtube).mp3" type="audio/mpeg">
            Trình duyệt của bạn không hỗ trợ thẻ audio.
        </audio>
    </div>

    <script>
        const audio = document.getElementById('audioPlayer');
        const albumArt = document.getElementById('albumArt');

        audio.onplay = function() {
            albumArt.classList.add('playing');
        };
        audio.onpause = function() {
            albumArt.classList.remove('playing');
        };
    </script>
</body>
</html>
