<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Nhắc Chữ - Karaoke Soroban</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #64748b;
            --text-highlight: #38bdf8;
            --text-done: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 900px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        h1 {
            font-size: 1.8rem;
            color: #f1f5f9;
        }

        /* Màn hình hiển thị chữ karaoke - Hiển thị 10 chữ gọn gàng */
        .teleprompter-screen {
            font-size: 2.6rem;
            font-weight: 700;
            line-height: 1.6;
            min-height: 220px;
            max-height: 260px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #090d16;
            border-radius: 12px;
            border: 2px solid #334155;
            flex-wrap: wrap;
            gap: 14px;
            word-break: break-word;
        }

        /* Hiệu ứng từng từ */
        .word {
            display: inline-block;
            color: var(--text-main);
            transition: color 0.25s ease, transform 0.25s ease;
        }

        /* Từ đang được đọc (Sáng rực, phóng to nhẹ giống Karaoke) */
        .word.active {
            color: var(--text-highlight);
            transform: scale(1.15);
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.7);
        }

        /* Từ đã đọc qua */
        .word.read {
            color: var(--text-done);
            opacity: 0.6;
        }

        /* Màn hình đếm ngược 3 2 1 */
        .countdown-overlay {
            font-size: 6rem;
            font-weight: bold;
            color: #f59e0b;
            text-shadow: 0 0 30px rgba(245, 158, 11, 0.7);
            animation: pulseCount 0.9s infinite alternate;
        }

        @keyframes pulseCount {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        /* Nút điều khiển */
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s, box-shadow 0.3s;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        }

        button:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        button:disabled {
            background-color: #475569;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .status {
            font-size: 0.95rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Phát Biểu - Khóa học Toán tư duy Soroban</h1>
        
        <div class="teleprompter-screen" id="screen">
            Nhấn "Bắt đầu" để chuẩn bị...
        </div>

        <div class="controls">
            <button id="startBtn" onclick="startCountdown()">Bắt đầu</button>
            <button id="pauseBtn" onclick="pauseTeleprompter()" disabled style="background-color: #e11d48;">Tạm dừng</button>
            <button id="resetBtn" onclick="resetTeleprompter()" disabled style="background-color: #475569;">Làm lại</button>
        </div>

        <div class="status" id="statusText">Trạng thái: Sẵn sàng</div>
    </div>

    <script>
        const rawText = `Xin chào quý thầy cô và các anh chị em học viên Mình xin tự giới thiệu mình là Chu Thị The sinh ngày 28 tháng 01 năm 1980 là học viên k179 số thứ tự 16. Mình tình cờ biết được khóa học toán tư duy thông qua một bài viết trên Facebook sau khi xem và cảm nhận được lợi ích tuyệt vời của khóa học mình đã quyết định đăng kí khóa học này. Không phụ niềm tin của mình vào khóa học trong quá trình học mình càng thấy quyết định đăng kí khóa học toán tư duy của mình là hoàn toàn chính xác. Mình cảm thấy Khóa học Toán tư duy Finger Math và Soroban là một hành trình khai phóng tư duy toàn diện kết hợp hoàn hảo giữa phản xạ trực quan trên đôi bàn tay và sự bứt phá tốc độ qua bàn tính ảo. Finger Math là Bước đệm trực quan sinh động với Phương pháp dùng 10 ngón tay biến những con số trừu tượng thành những công cụ hiện hữu ngay trước mắt. Việc phối hợp nhịp nhàng giữa tay và não giúp loại bỏ hoàn toàn tâm lý sợ Toán tạo phản xạ cộng trừ nhanh chóng trong phạm vi từ 0 đến 99 một cách tự nhiên. Soroban là sự Đột phá về tư duy không gian và Anzan là bước nhảy vọt về tốc độ và khả năng ghi nhớ. Việc tưởng tượng hình ảnh các hạt tính chuyển động trong đầu giúp kích hoạt đồng thời cả hai bán cầu não: Não trái xử lý logic quy tắc; Não phải tưởng tượng hình ảnh không gian. Với Sự gắn kết logic tuyệt vời giữa 2 phương pháp: Finger Math đóng vai trò là nền móng xây dựng sự tự tin ban đầu còn Soroban là đòn bẩy đưa tốc độ xử lý thông tin lên mức tối đa. Trong quá trình học em cảm nhận được sự Tâm huyết Tận tụy và Truyền cảm hứng của đội ngũ giảng viên như Cô Ánh Lan cô Nguyễn Hạnh thầy Quân. Vì Cả Finger Math lẫn Soroban đều đòi hỏi độ chính xác trong từng thao tác tay và sự tập trung cao độ nhưng các thầy cô luôn tỉ mỉ uốn nắn từng ngón tay chỉnh sửa từng động tác gảy hạt và kiên nhẫn chờ đợi từng bước tưởng tượng của học viên mà không hề gây áp lực. Thầy cô biến mỗi buổi học thành một sân chơi phản xạ hào hứng thông qua các trò chơi toán học thi đấu tốc độ. Cách giảng dạy linh hoạt tinh tế nhận biết điểm mạnh yếu của từng học viên giúp lớp học luôn tràn ngập tiếng cười và động lực. Sự tận tâm của giảng viên không chỉ nằm ở giờ lên lớp mà còn thể hiện qua việc theo dõi sát tiến độ luyện tập hằng ngày luôn sẵn sàng giải đáp và định hướng cho phụ huynh và học viên. Sau khóa học em thấy: Toán học không còn là những con số hay công thức khô khan hay sự ép buộc mà trở thành môn học của sự sáng tạo phản xạ và niềm vui. Đồng thời có sự cải thiện rõ rệt không chỉ ở khả năng tính nhẩm siêu tốc mà quan trọng hơn là sự tập trung cao độ tính kiên trì tỉ mỉ và khả năng ghi nhớ không gian. Ngoài ra Việc chinh phục được những dãy số dài phức tạp bằng chính bộ não của mình mang lại niềm tin lớn vào khả năng tự học và giải quyết các vấn đề khó khăn trong cuộc sống. Hành trình của khóa học ngày hôm nay khép lại nhưng chiếc bàn tính Soroban ảo trong tâm trí và những bài học vô giá từ thầy cô sẽ còn theo em mãi về sau. Em xin được gửi lời cảm ơn tri ân nhất đến các thầy cô những người kiến tạo tư duy đầy tâm huyết và cảm ơn chính chúng ta vì đã nỗ lực hết mình. Chúc cho tất cả các bạn học viên luôn giữ vững sự tự tin trí tuệ sắc bén và niềm ham học hỏi trên những chặng đường phía trước.`;

        // Tách chuỗi thành mảng các từ chuẩn xác, không bị dính chữ
        const words = rawText.split(/\s+/);
        const screen = document.getElementById('screen');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const statusText = document.getElementById('statusText');

        let currentIndex = 0;
        let timer = null;
        let isRunning = false;
        let isPaused = false;
        const CHUNK_SIZE = 10; // Giới hạn hiển thị đúng 10 chữ mỗi lần

        // Chuẩn bị sẵn các thẻ từ trong DOM khi tải trang
        function initScreen() {
            screen.innerHTML = '';
            words.forEach((word, index) => {
                const span = document.createElement('span');
                span.className = 'word';
                span.innerText = word;
                span.id = `word-${index}`;
                screen.appendChild(span);
            });
            updateDisplayChunk();
        }

        // Cập nhật cửa sổ hiển thị (luôn gom 10 chữ và bật hiệu ứng karaoke sáng theo từng từ)
        function updateDisplayChunk() {
            const spans = screen.getElementsByClassName('word');
            for (let i = 0; i < spans.length; i++) {
                spans[i].style.display = 'none'; // Ẩn tất cả trước
            }

            // Xác định khung 10 chữ hiện tại dựa vào currentIndex
            const chunkStart = Math.floor(currentIndex / CHUNK_SIZE) * CHUNK_SIZE;
            const chunkEnd = Math.min(chunkStart + CHUNK_SIZE, words.length);

            for (let i = chunkStart; i < chunkEnd; i++) {
                spans[i].style.display = 'inline-block';
                if (i < currentIndex) {
                    spans[i].className = 'word read'; // Đã đọc qua
                } else if (i === currentIndex) {
                    spans[i].className = 'word active'; // Đang đọc (Hiệu ứng Karaoke)
                } else {
                    spans[i].className = 'word'; // Chưa đọc tới
                }
            }
        }

        // Bắt đầu đếm ngược 3, 2, 1
        function startCountdown() {
            startBtn.disabled = true;
            pauseBtn.disabled = true;
            resetBtn.disabled = true;

            let count = 3;
            statusText.innerText = "Trạng thái: Chuẩn bị...";
            screen.innerHTML = `<div class="countdown-overlay">${count}</div>`;

            const countInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    screen.innerHTML = `<div class="countdown-overlay">${count}</div>`;
                } else {
                    clearInterval(countInterval);
                    initScreen(); // Khởi tạo lại khung chữ chuẩn
                    runTeleprompter(); // Bắt đầu chạy
                }
            }, 1000);
        }

        // Chạy nhắc chữ hiệu ứng Karaoke
        function runTeleprompter() {
            isRunning = true;
            isPaused = false;
            pauseBtn.disabled = false;
            resetBtn.disabled = false;
            statusText.innerText = "Trạng thái: Đang chạy karaoke...";

            timer = setInterval(() => {
                if (currentIndex < words.length) {
                    updateDisplayChunk();
                    currentIndex++;
                } else {
                    stopTeleprompter();
                    statusText.innerText = "Trạng thái: Đã hoàn thành!";
                    startBtn.disabled = false;
                    startBtn.innerText = "Bắt đầu";
                    pauseBtn.disabled = true;
                }
            }, 400); // Tốc độ chạy từng từ vừa phải (400ms mỗi từ)
        }

        function pauseTeleprompter() {
            if (isRunning) {
                clearInterval(timer);
                isRunning = false;
                isPaused = true;
                startBtn.disabled = false;
                startBtn.innerText = "Tiếp tục";
                pauseBtn.disabled = true;
                statusText.innerText = "Trạng thái: Đã tạm dừng";
            }
        }

        function stopTeleprompter() {
            clearInterval(timer);
            isRunning = false;
        }

        function resetTeleprompter() {
            stopTeleprompter();
            isPaused = false;
            currentIndex = 0;
            startBtn.disabled = false;
            startBtn.innerText = "Bắt đầu";
            pauseBtn.disabled = true;
            resetBtn.disabled = true;
            statusText.innerText = "Trạng thái: Sẵn sàng";
            screen.innerHTML = 'Nhấn "Bắt đầu" để chuẩn bị...';
        }

        // Load ban đầu
        window.onload = () => {
            initScreen();
            screen.innerHTML = 'Nhấn "Bắt đầu" để chuẩn bị...';
        };
    </script>
</body>
</html>
